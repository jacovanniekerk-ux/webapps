<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escape the Algorithm · Digital Skills Midpoint Challenge</title>
<style>
:root{--navy:#001489;--blue:#007DBA;--teal:#00A1A3;--green:#8FAD15;--mag:#C8126E;--ink:#0b1440;--zc:#007DBA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000a3d;font-family:'Century Gothic','Futura','Avenir Next','Trebuchet MS',Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;display:block}
button{font-family:inherit;cursor:pointer;border:0}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,rgba(0,20,137,.97),rgba(0,20,137,.86));border-bottom:3px solid var(--zc);z-index:5;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hud.show{display:flex}
.zonePill{background:var(--zc);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 0 14px var(--zc)}
.zoneName{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.sp{flex:1}
.stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.bat{display:flex;gap:3px}
.bat i{width:11px;height:18px;border-radius:3px;background:#8FAD15;box-shadow:0 0 6px #8FAD15;display:block}
.bat i.off{background:rgba(255,255,255,.18);box-shadow:none}
.inv{display:flex;gap:6px}
.slot{position:relative;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;border:2px solid transparent;transition:.2s}
.slot.has{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.2)}
.slot.empty{opacity:.35}
.slot b{position:absolute;bottom:-4px;right:-4px;background:var(--mag);font-size:10px;border-radius:8px;padding:1px 5px}
.slot small{position:absolute;top:-5px;left:-4px;background:#fff;color:var(--navy);font-size:9px;border-radius:6px;padding:0 4px;font-weight:700}
.slot.active{border-color:#8FAD15;box-shadow:0 0 14px #8FAD15}
.slot.cd{opacity:.5}
.hbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.hbtn:hover{background:rgba(255,255,255,.28)}
#minimap{position:fixed;right:12px;bottom:12px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,10,61,.75);z-index:4;display:none}
#powers{position:fixed;left:12px;bottom:12px;z-index:4;display:none;gap:6px;flex-direction:column}
.pchip{background:rgba(0,20,137,.88);border-left:4px solid var(--c);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700}
#banner{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:800;font-size:clamp(16px,3vw,26px);padding:10px 22px;border-radius:16px;background:rgba(200,18,110,.92);box-shadow:0 0 30px rgba(200,18,110,.7);opacity:0;transition:opacity .3s;text-align:center}
#banner.show{opacity:1}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);z-index:40;background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;border-left:6px solid var(--teal)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{margin-left:10px;background:var(--navy);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700}
/* Touch */
#touch{position:fixed;inset:auto 0 0 0;z-index:6;display:none;pointer-events:none;padding:14px;justify-content:space-between;align-items:flex-end}
#touch.show{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;pointer-events:auto}
.dpad button,.acts button{background:rgba(0,20,137,.7);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:16px;font-size:24px}
.dpad button:active,.acts button:active{background:var(--teal)}
.acts{display:flex;flex-direction:column;gap:8px;pointer-events:auto;margin-bottom:120px}
.acts button{width:58px;height:58px}
/* Overlay & cards */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,10,61,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:20;padding:14px}
#overlay.show{display:flex}
.card{position:relative;background:#fff;color:var(--ink);border-radius:24px;max-width:780px;width:100%;max-height:94vh;overflow:auto;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.5);border-top:10px solid var(--zc);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card h1{font-size:clamp(26px,5vw,46px);line-height:1.05;color:var(--navy)}
.card h2{font-size:clamp(18px,2.6vw,24px);line-height:1.3;color:var(--navy);margin:8px 0 16px}
.card p{line-height:1.5;margin:8px 0;font-size:15px}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--zc);color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#f1f5fc;color:var(--ink);font-size:15px;padding:13px 14px;border-radius:14px;border:2px solid #dbe4f3;transition:.15s;font-weight:600;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--zc);transform:translateX(4px);background:#fff}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--zc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.opt.ok{background:#eef6d6;border-color:var(--green)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#fbe3ef;border-color:var(--mag)}
.opt.bad .k{background:var(--mag)}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:800;font-size:16px;padding:13px 22px;border-radius:14px;box-shadow:0 6px 18px rgba(0,20,137,.35);transition:.15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,20,137,.45)}
.btn.big{font-size:20px;padding:16px 30px}
.btn.g{background:linear-gradient(135deg,var(--green),var(--teal))}
.btn.m{background:linear-gradient(135deg,var(--mag),var(--navy))}
.ghost{background:transparent;color:var(--navy);font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid #dbe4f3}
.pw{background:#eaf7f7;color:#006b6d;font-weight:800;padding:10px 14px;border-radius:12px;border:2px solid var(--teal)}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;display:none;line-height:1.45;font-size:15px}
.fb.ok{display:block;background:#f2f8e2;border-left:6px solid var(--green)}
.fb.bad{display:block;background:#fdeef5;border-left:6px solid var(--mag)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
/* Title */
.title{background:radial-gradient(circle at 20% 0%,#0b2bd0 0%,#001489 45%,#000a3d 100%);color:#fff;border-top-color:var(--teal);text-align:center}
.title h1{color:#fff;font-size:clamp(30px,6vw,58px);letter-spacing:.02em;text-shadow:0 0 30px rgba(0,161,163,.8)}
.title .sub{font-weight:800;letter-spacing:.2em;font-size:12px;color:#7fe3e4;text-transform:uppercase}
.title p{color:#dfe7ff}
.stripe{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:14px auto;max-width:320px}
.stripe i{flex:1}
.title input{font-family:inherit;font-size:17px;padding:12px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;width:min(340px,100%);text-align:center;outline:none}
.title input::placeholder{color:#b8c4f0}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0;text-align:left}
.zg{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;border-left:5px solid var(--c);font-size:13px}
.zg b{display:block;font-size:14px;margin-bottom:2px}
.howto{text-align:left;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 16px;margin-top:12px;font-size:13.5px;line-height:1.6}
.howto summary{cursor:pointer;font-weight:800}
.kbd{display:inline-block;background:#fff;color:var(--navy);border-radius:6px;padding:0 6px;font-weight:800;font-size:12px;margin:0 2px}
/* Zone intro */
.zbig{font-size:clamp(46px,9vw,90px);font-weight:900;color:var(--zc);line-height:1;letter-spacing:-.02em}
.mission{display:grid;gap:8px;margin:14px 0}
.mission div{background:#f1f5fc;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px}
/* Guardian */
.gface{font-size:clamp(70px,13vw,120px);text-align:center;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 0 22px var(--zc))}
@keyframes float{50%{transform:translateY(-12px) rotate(-4deg)}}
.taunt{background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-style:italic;position:relative;margin:10px auto 6px;max-width:560px;text-align:center}
.ghp{height:14px;border-radius:10px;background:#e3e8f3;overflow:hidden;margin:6px 0 14px}
.ghp i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--zc));transition:width .4s}
.ghead{display:flex;align-items:center;gap:12px}
.ghead .mini{font-size:44px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:#f1f5fc;border:2px solid #dbe4f3;color:var(--ink);font-weight:700;padding:12px 16px;border-radius:14px;font-size:15px;transition:.15s}
.chip:hover:not(:disabled){border-color:var(--zc);transform:translateY(-3px)}
.chip.ok{background:var(--green);color:#fff;border-color:var(--green)}
.chip.bad{background:var(--mag);color:#fff;border-color:var(--mag)}
.chip.used{visibility:hidden}
.stair{display:flex;flex-direction:column-reverse;gap:6px;margin:12px auto;max-width:420px;min-height:40px}
.stair div{color:#fff;font-weight:800;padding:10px 14px;border-radius:12px;animation:pop .35s}
.sortcard{margin:14px auto;max-width:440px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;text-align:center;padding:22px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-height:84px;display:flex;align-items:center;justify-content:center}
.sortcard.fly-l{animation:flyl .35s forwards}.sortcard.fly-r{animation:flyr .35s forwards}
@keyframes flyl{to{transform:translateX(-140px) scale(.5);opacity:0}}@keyframes flyr{to{transform:translateX(140px) scale(.5);opacity:0}}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border-radius:18px;padding:16px;color:#fff;font-weight:800;font-size:16px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.15s}
.bin:hover{transform:scale(1.03)}
.bin span{font-size:12px;opacity:.85}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px}
.mi{background:#f1f5fc;border:2px solid #dbe4f3;color:var(--ink);font-weight:700;padding:11px 12px;border-radius:12px;font-size:14px;text-align:left}
.mi.sel{border-color:var(--zc);background:#e6f4fb;box-shadow:0 0 0 3px rgba(0,125,186,.2)}
.mi.done{color:#fff;border-color:transparent}
.mi.bad{animation:shake .35s;border-color:var(--mag)}
.reward{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--zc));color:#fff;border-radius:18px;padding:16px 18px;margin:14px 0}
.reward .ic{font-size:52px}
.reward b{font-size:19px}
/* Boss */
.boss{background:radial-gradient(circle at 50% 0%,#5a0c63 0%,#1b0748 45%,#000a3d 100%);color:#fff;border-top-color:var(--mag)}
.boss h2{color:#fff}
.bossTop{display:flex;align-items:center;gap:16px}
.bossFace{font-size:clamp(60px,10vw,96px);filter:drop-shadow(0 0 26px #C8126E);animation:float 2s ease-in-out infinite}
.bossFace.hit{animation:bhit .5s}
@keyframes bhit{0%{filter:brightness(4) drop-shadow(0 0 40px #fff)}30%{transform:translate(-14px,6px) rotate(-12deg)}60%{transform:translate(12px,-4px) rotate(10deg)}}
.bhp{height:18px;border-radius:12px;background:rgba(255,255,255,.15);overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.bhp i{display:block;height:100%;background:linear-gradient(90deg,#C8126E,#ff5fae);transition:width .5s}
.timer{height:8px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#8FAD15,#00A1A3)}
.boss .opt{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.boss .opt:hover:not(:disabled){background:rgba(255,255,255,.16)}
.boss .opt.ok{background:rgba(143,173,21,.35);border-color:#8FAD15}
.boss .opt.bad{background:rgba(200,18,110,.4);border-color:#C8126E}
.boss .fb.ok{background:rgba(143,173,21,.2);color:#fff}
.boss .fb.bad{background:rgba(200,18,110,.25);color:#fff}
.beam{position:fixed;left:50%;bottom:20%;width:12px;height:0;background:linear-gradient(0deg,#00A1A3,#fff);box-shadow:0 0 30px #00A1A3,0 0 60px #fff;border-radius:8px;z-index:30;transform:translateX(-50%);animation:beam .45s ease-out forwards;pointer-events:none}
@keyframes beam{0%{height:0;opacity:1}70%{height:70vh;opacity:1}100%{height:70vh;opacity:0}}
.flash{position:fixed;inset:0;background:#C8126E;opacity:0;z-index:29;pointer-events:none;animation:fl .5s}
@keyframes fl{20%{opacity:.45}}
/* End */
.badge{width:200px;height:200px;margin:8px auto;border-radius:50%;background:conic-gradient(#001489,#007DBA,#00A1A3,#8FAD15,#C8126E,#001489);display:flex;align-items:center;justify-content:center;animation:spin 8s linear infinite;box-shadow:0 0 40px rgba(0,161,163,.6)}
.badge>div{width:166px;height:166px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spin 8s linear infinite reverse;color:var(--navy);text-align:center;padding:10px}
.badge .e{font-size:54px}
@keyframes spin{to{transform:rotate(360deg)}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.sgrid div{background:#f1f5fc;border-radius:14px;padding:12px;text-align:center;font-size:12px;font-weight:700;color:#4a5680}
.sgrid b{display:block;font-size:24px;color:var(--navy)}
@media (max-width:640px){.zoneName{display:none}.card{padding:20px 18px}.stat{font-size:12px;padding:4px 8px}.slot,.hbtn{width:34px;height:34px;font-size:16px}#minimap{display:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="zonePill" id="hZone">ZONE 1</div>
  <div class="zoneName" id="hName"></div>
  <div class="sp"></div>
  <div class="stat" title="Battery">🔋<div class="bat" id="hBat"></div></div>
  <div class="stat" title="Score">⭐ <span id="hScore">0</span></div>
  <div class="stat" title="Streak">🔥 <span id="hStreak">0</span></div>
  <div class="inv" id="hInv"></div>
  <button class="hbtn" id="bMute" title="Sound (M)">🔊</button>
  <button class="hbtn" id="bHelp" title="Pause / Help (P)">⏸</button>
  <button class="hbtn" id="bFS" title="Full screen (F)">⛶</button>
</div>
<canvas id="minimap" width="300" height="220"></canvas>
<div id="powers"></div>
<div id="banner"></div>
<div id="touch">
  <div class="dpad">
    <span></span><button data-d="u">▲</button><span></span>
    <button data-d="l">◀</button><span></span><button data-d="r">▶</button>
    <span></span><button data-d="d">▼</button><span></span>
  </div>
  <div class="acts">
    <button id="tQR" title="QR Map">📱</button>
    <button id="tBoost" title="URL Shortener boost">🔗</button>
    <button id="tCloak" title="Canva Cloak">🎨</button>
  </div>
</div>
<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
/* ============ BRAND ============ */
const C={navy:'#001489',blue:'#007DBA',teal:'#00A1A3',green:'#8FAD15',mag:'#C8126E'};
const EMOJI='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* ============ CONTENT (Modules 1–4) ============ */
const ZONES=[
 {title:'The Foundation Citadel',module:'Module 1 · Introduction & Background',col:C.blue,w:8,h:6,bots:2,
  story:'The Algorithm has frozen this citadel on the bottom step of SAMR. Remind it that digital teaching remains <b>teaching</b>.',
  guardian:{name:'The Substitution Golem',face:'🗿',taunt:'"For a thousand years I have stood on the bottom step of SAMR. A PowerPoint is the PEAK of innovation! You will never climb higher!"',
   stages:[
    {type:'order',prompt:'Rebuild the SAMR staircase — click the steps from the BOTTOM to the TOP.',items:['Substitution','Augmentation','Modification','Redefinition'],cols:[C.navy,C.blue,C.teal,C.green]},
    {type:'pick',prompt:'Power the 4C Core! Select the four Cs of modern learning.',correct:['Critical thinking','Creativity','Collaboration','Communication'],wrong:['Coding','Compliance','Copying','Calculation']},
    {type:'order',prompt:'Restart the timeline — place the Industrial Revolutions in order (first to latest).',items:['Steam & factories (1760–1840)','Electricity (1870–1910)','The internet (1970–2000)','AI & the Internet of Things (2010–)'],cols:[C.navy,C.blue,C.teal,C.green]}
   ]},
  reward:{id:'lantern',ic:'🏮',name:'TPACK Lantern',desc:'Technical + Pedagogical + Content knowledge now light the way. Your vision radius is permanently expanded.'}},
 {title:'The Environment Engine',module:'Module 2 · Digital Teaching & Learning Environment',col:C.teal,w:9,h:7,bots:3,
  story:'Cables everywhere, 47 tabs open and a WOW Monster on the loose. Restore order to the teaching and learning environment.',
  guardian:{name:'The WOW Monster',face:'🤩',taunt:'"Ooooh, SHINY! New app! NEW APP! Excitement IS engagement, right?! Let\'s try a different tool every single lesson!"',
   stages:[
    {type:'sort',prompt:'Sort each habit: does it build a focused learning environment, or feed the WOW chaos?',bins:[{n:'Focused Classroom',ic:'✅',c:C.teal},{n:'WOW Chaos',ic:'💥',c:C.mag}],
     items:[['Organise files in cloud folders',0],['Bookmark folders for key sites',0],['A dedicated device charging station',0],['30-second end-of-lesson clean-up',0],['Embed a curated YouTube playlist',0],['Introduce one new tool at a time',0],['Share a QR code instead of a long URL',0],['A brand-new app every lesson',1],['Send learners to search YouTube alone',1],['Save everything on the desktop',1],['Write a 90-character URL on the board',1],['Choose tools for the wow, not the outcome',1]]}
   ]},
  reward:{id:'station',ic:'🔌',name:'Device Station',desc:'A tidy, dedicated charging station keeps learning powered. Max battery +1 and fully recharged.'}},
 {title:'The Content Studio',module:'Module 3 · Digital Content',col:C.mag,w:10,h:7,bots:3,
  story:'A Watermark Wraith is stamping stolen images onto everything. Source ethically, design with purpose and make video work for learning.',
  guardian:{name:'The Watermark Wraith',face:'👻',taunt:'"Every image you find is MINE… stamped with my watermark for all eternity. Just crop it out — nobody will notice! Mwahaha!"',
   stages:[
    {type:'match',prompt:'Break the curse: match each free tool to what it does best.',pairs:[['Freepik','Clipart'],['Unsplash','Photos'],['Flaticon','Icons'],['Pixabay','All-in-one: photos, vectors & clipart'],['Loom','Screen recording'],['Clipchamp','Video editing']]},
    {type:'sort',prompt:'Video in the classroom: is it a POWER or a RISK?',bins:[{n:'The Power',ic:'⚡',c:C.green},{n:'The Risk',ic:'⚠️',c:C.mag}],
     items:[['Multimodal learning',0],['Self-paced learning',0],['Engagement & real-world context',0],['Pause, rewind and rewatch',0],['Cognitive overload',1],['Passive consumption',1],['Accessibility & the digital divide',1]]}
   ]},
  reward:{id:'cloak',ic:'🎨',name:'Canva Cloak',desc:'Press SPACE (or 🎨) to design yourself invisible to Distractions for 5 seconds. Recharges after 15 seconds.'}},
 {title:'The Learning Hub',module:'Module 4 · Managing Learning',col:C.green,w:11,h:8,bots:4,
  story:'Links are multiplying like hydra heads. Learners are lost between a dozen portals. Build one clear, central hub.',
  guardian:{name:'The Link Hydra',face:'🐉',taunt:'"Cut off one link and TWO more grow! A WhatsApp group here, a website there, three classrooms everywhere! Your learners will drown in portals!"',

let ac=null,muted=false;
function tone(f,d,type='sine',v=.15,f2=null,delay=0){
 if(muted)return; try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
 }catch(e){}
}

/* ============ MAZE ============ */
function genMaze(w,h){
 const W=2*w+1,H=2*h+1,g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill(1));
 const vis=Array.from({length:h},()=>new Array(w).fill(false));
 const st=[[0,0]];vis[0][0]=true;g[1][1]=0;
 while(st.length){const [cx,cy]=st[st.length-1],nb=[];
  for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<w&&ny<h&&!vis[ny][nx])nb.push([nx,ny,dx,dy]);}
  if(!nb.length){st.pop();continue;}
  const [nx,ny,dx,dy]=nb[rnd(nb.length)];vis[ny][nx]=true;g[2*cy+1+dy][2*cx+1+dx]=0;g[2*ny+1][2*nx+1]=0;st.push([nx,ny]);}
 return g;
}
function bfs(g,sx,sy,tx,ty,pass){
 const H=g.length,W=g[0].length,prev=new Map(),q=[[sx,sy]];prev.set(k2(sx,sy),null);
 while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const kk=k2(nx,ny);
   if(prev.has(kk))continue;if(!(nx===tx&&ny===ty)&&!pass(g[ny][nx]))continue;prev.set(kk,[x,y]);q.push([nx,ny]);}}
 if(!prev.has(k2(tx,ty)))return null;
 const path=[];let c=[tx,ty];while(c){path.unshift(c);c=prev.get(k2(c[0],c[1]));}return path;
}
function buildLevel(i){
 const Z=ZONES[i],g=genMaze(Z.w,Z.h),H=g.length,W=g[0].length;
 const path=bfs(g,1,1,W-2,H-2,v=>v!==1);
 const doors=[];
 const place=idx=>{for(let d=0;d<10;d++)for(const s of [idx+d,idx-d]){if(s<3||s>path.length-5)continue;const [x,y]=path[s];
   if((x&1)===(y&1))continue;if(g[y][x]!==0)continue;if(doors.some(o=>Math.abs(o.i-s)<4))continue;return s;}return -1;};
 [.2,.43,.66].forEach(f=>{const s=place(Math.round(f*(path.length-1)));if(s>=0){const [x,y]=path[s];g[y][x]=2;doors.push({x,y,i:s});}});
 doors.sort((a,b)=>a.i-b.i);doors.forEach((d,n)=>d.num=n+1);
 const [gx,gy]=path[path.length-2],[ex,ey]=path[path.length-1];g[gy][gx]=3;g[ey][ex]=4;
 const onPath=new Set(path.map(p=>k2(p[0],p[1])));
 const ends=[];
 for(let y=1;y<H;y+=2)for(let x=1;x<W;x+=2){if((x===1&&y===1)||(x===ex&&y===ey)||onPath.has(k2(x,y)))continue;
  let n=0;for(const [dx,dy] of DIRS)if(g[y+dy][x+dx]!==1)n++;if(n===1)ends.push([x,y]);}
 const pick=new Map(),es=shuffle(ends),must=['qr','lens','shield','solar'],extra=['lens','shield','solar','boost','qr','boost','solar'];
 const nP=Math.min(es.length,4+i);
 for(let j=0;j<nP;j++){const t=j<must.length?must[j]:extra[rnd(extra.length)];pick.set(k2(es[j][0],es[j][1]),t);}
 if(!Array.from(pick.values()).includes('boost')&&es[nP])pick.set(k2(es[nP][0],es[nP][1]),'boost');
 const bytes=new Set();
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(g[y][x]===0&&!(x===1&&y===1)&&!pick.has(k2(x,y))&&Math.random()<.22)bytes.add(k2(x,y));
 const seen=Array.from({length:H},()=>new Array(W).fill(false));
 L={i,Z,g,W,H,doors,pick,bytes,seen,gateOpen:false,used:new Set(),t0:performance.now(),b0:stats.bytes,gx,gy,ex,ey,firstTry0:stats.firstTry};
 P={x:1,y:1,fx:1,fy:1,tx:1,ty:1,t:0,moving:false,dir:'r',px:1,py:1};
 spawnBots();cam.x=(1.5)*T;cam.y=(1.5)*T;markSeen();
 document.documentElement.style.setProperty('--zc',Z.col);
}
function spawnBots(){
 bots=[];const c=[];
 for(let y=1;y<L.H-1;y++)for(let x=1;x<L.W-1;x++)if(L.g[y][x]===0&&Math.abs(x-P.x)+Math.abs(y-P.y)>9)c.push([x,y]);
 shuffle(c).slice(0,L.Z.bots).forEach(([x,y])=>bots.push({x,y,fx:x,fy:y,tx:x,ty:y,t:1,px:x,py:y,last:null,n:1+rnd(98),ph:Math.random()*6}));
}

function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
 const d=document,el=d.documentElement;
 try{
  if(fsEl()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){fsFallback();return;}
  const p=req.call(el);if(p&&p.catch)p.catch(fsFallback);
 }catch(e){fsFallback();}
}
function fsFallback(){
 if(window.self!==window.top){toast('Full screen is blocked inside this frame.',[['Open in new tab',()=>window.open(location.href,'_blank')]]);}
 else toast('Full screen isn\'t supported here. Try F11 (Windows) or ⌃⌘F (Mac).');

function update(dt){
 for(const k of ['boost','cloak','cloakCD','reveal','invuln','blackout','shake'])if(tm[k]>0)tm[k]=Math.max(0,tm[k]-dt);

 // player

   if(ch){b.tx=b.x+ch[0];b.ty=b.y+ch[1];b.last=ch;}else{b.tx=b.x;b.ty=b.y;}
  }

 const W=L.W,H=L.H,s=Math.min(300/W,220/H),ow=(300-W*s)/2,oh=(220-H*s)/2;
 mctx.clearRect(0,0,300,220);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!L.seen[y][x])continue;const v=L.g[y][x];
  mctx.fillStyle=v===1?'rgba(0,125,186,.45)':v===2?L.Z.col:v===3?C.mag:v===4?C.green:'rgba(255,255,255,.85)';mctx.fillRect(ow+x*s,oh+y*s,s+.5,s+.5);}
 mctx.fillStyle=Math.floor(time*4)%2?C.mag:'#fff';mctx.beginPath();mctx.arc(ow+(P.px+.5)*s,oh+(P.py+.5)*s,Math.max(3,s*.7),0,7);mctx.fill();
 const sc=Math.min(150,VW*.28)/300;mm.style.width=300*sc+'px';mm.style.height=220*sc+'px';
}
function drawBG(dt){
 ctx.fillStyle='#000a3d';ctx.fillRect(0,0,VW,VH);
 const s=40;ctx.strokeStyle='rgba(0,125,186,.12)';ctx.lineWidth=1;
 const off=(time*20)%s;for(let x=-s;x<VW+s;x+=s){ctx.beginPath();ctx.moveTo(x+off,0);ctx.lineTo(x+off,VH);ctx.stroke();}
 for(let y=-s;y<VH+s;y+=s){ctx.beginPath();ctx.moveTo(0,y+off);ctx.lineTo(VW,y+off);ctx.stroke();}
 if(bg.length<70&&Math.random()<.5){const cs=[C.blue,C.teal,C.green,C.mag,'#fff'];bg.push({x:Math.random()*VW,y:-10,v:40+Math.random()*120,c:cs[rnd(5)],s:3+Math.random()*6,r:Math.random()*6,conf:false});}
 for(const p of bg){p.y+=p.v*dt;p.r+=dt*3;if(p.conf){p.x+=p.vx*dt;p.vx*=.99;}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=p.conf?1:.55;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*(p.conf?.5:1));ctx.restore();}
 bg=bg.filter(p=>p.y<VH+20);
}
function confetti(n){const cs=[C.blue,C.teal,C.green,C.mag,'#fff','#FFC600'];for(let i=0;i<n;i++)bg.push({x:VW/2+(Math.random()-.5)*200,y:VH*.4,v:60+Math.random()*200,vx:(Math.random()-.5)*900,c:cs[rnd(6)],s:8+Math.random()*8,r:Math.random()*6,conf:true});}
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(L&&(state==='play'||state==='modal')){
  if(state==='play')update(dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt;}parts=parts.filter(p=>p.life>0);
  for(const t of texts)t.life-=dt;texts=texts.filter(t=>t.life>0);
  drawWorld(dt);mmT-=dt;if(mmT<=0){mmT=.15;drawMini();}
  if(state==='play'&&Math.floor(time*4)!==Math.floor((time-dt)*4))updateHUD();
 }else drawBG(dt);
 requestAnimationFrame(loop);
}

function nextQ(){
 const pool=Q[L.i];if(L.used.size>=pool.length)L.used.clear();
 let i;do{i=rnd(pool.length);}while(L.used.has(i));L.used.add(i);return pool[i];
}
function buildOpts(q){return q.tf?[{t:'True',c:q.a==='True'},{t:'False',c:q.a==='False'}]:shuffle([{t:q.a,c:true},...q.w.map(t=>({t,c:false}))]);}

 const btns=[...card.querySelectorAll('.opt')];

  if(done||btns[i].disabled)return;done=true;stats.answered++;

  }else{

function stageSize(s){return s.type==='order'?s.items.length:s.type==='pick'?s.correct.length:s.type==='sort'?s.items.length:s.pairs.length;}

 const finish=()=>{SFX.ok();setTimeout(()=>{if(si+1<G.stages.length)runGuardian(si+1,mist);else guardianWin(mist);},650);};
 if(S.type==='order'){
  A.innerHTML=`<div class="stair" id="st"></div><div class="chips">${shuffle(S.items).map(t=>`<button class="chip">${t}</button>`).join('')}</div>`;
  const st=A.querySelector('#st');let n=0;

   <div class="bins">${S.bins.map((b,i)=>`<button class="bin" data-b="${i}" style="background:${b.c}"><div style="font-size:28px">${b.ic}</div>${b.n}<span id="bc${i}">0 sorted</span></button>`).join('')}</div>`;

function bossWin(){
 clearInterval(bTimer);SFX.power();setTimeout(SFX.ok,600);
 const card=openModal(`<div style="text-align:center"><div class="bossFace hit" style="font-size:120px">💥</div><h1 style="color:#fff;font-size:clamp(30px,6vw,52px)">THE ALGORITHM IS OFFLINE</h1>
  <p style="color:#e8dcff">Learning objectives are back in charge. Engagement serves learning again — not the other way around.</p>
  <div class="row" style="justify-content:center"><button class="btn g big" id="go">🏆 Claim your badge</button></div></div>`,'boss');
 const go=()=>endScreen();card.querySelector('#go').onclick=go;mk=e=>{if(e.key==='Enter')go();};
}
function endScreen(){
 state='end';L=null;showHUD(false);stats.end=performance.now();confetti(160);setTimeout(()=>confetti(120),900);
 const acc=stats.answered?Math.round(stats.correct/stats.answered*100):0,secs=Math.round((stats.end-stats.start)/1000);
 const rank=acc>=90?['🚀','SAMR Redefiner','You didn\'t just climb the SAMR staircase — you redefined it.']:acc>=75?['⚡','Transformation Agent','You\'re firmly in the transformation zone. Keep modifying and redefining!']:acc>=55?['🔧','Digital Augmenter','Strong foundations with real functional improvement. Revisit a few modules to climb higher.']:['🌱','Brave Substitutor','Every expert started on the first step. Revisit Modules 1–4 and play again!'];
 let best=0;try{best=+localStorage.getItem('etaBest')||0;if(score>best)localStorage.setItem('etaBest',score);}catch(e){}
 const card=openModal(`<div style="text-align:center"><span class="tag">Digital Skills Course · Midpoint Challenge Complete</span>
  <div class="badge"><div><div class="e">${rank[0]}</div><b style="font-size:15px">${rank[1]}</b><span style="font-size:11px">Modules 1–4</span></div></div>
  <h1>${playerName?playerName.replace(/[<>&]/g,'')+', you':'You'} escaped the Algorithm!</h1><p>${rank[2]}</p></div>
  <div class="sgrid"><div><b>${score}</b>final score${score>best&&best?'<br>🏅 NEW BEST':''}</div><div><b>${acc}%</b>accuracy</div><div><b>${bestStreak}</b>best streak</div><div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b>total time</div><div><b>${stats.bytes}</b>data bytes</div><div><b>${stats.reboots}</b>reboots</div></div>
  <p style="text-align:center;font-size:14px;color:#4a5680">📸 Take a screenshot of this badge to celebrate your progress at the midpoint of the course.</p>
  <div class="row" style="justify-content:center"><button class="btn g big" id="again">🔁 Play again</button><button class="ghost fsb" id="fs">⛶ Full screen</button></div>`,'',C.teal);
 card.querySelector('#again').onclick=()=>{closeModal();titleScreen();};card.querySelector('#fs').onclick=toggleFS;fsIcon();
}
function showPause(){
 state='modal';
 const card=openModal(`<span class="tag">⏸ Paused</span><h1 style="margin-top:8px">How to play</h1>
  <div class="mission"><div>🕹 Move: <span class="kbd">↑↓←→</span> or <span class="kbd">WASD</span> (on-screen pad on touch devices)</div>
  <div>🔒 Walk into a <b>?</b> gate to answer a question · ${'<span class="kbd">1–4</span>'} to answer</div>
  <div>🔍 Search Lens (${inv.lens}) — removes 2 wrong answers · 🛡️ Firewall Shield (${inv.shield}) — blocks a hit</div>
  <div>📱 QR Map (${inv.qr}) <span class="kbd">Q</span> · 🔗 URL Shortener (${inv.boost}) <span class="kbd">E</span>${powers.cloak?' · 🎨 Canva Cloak <span class="kbd">SPACE</span>':''}</div>
  <div>☀️ Solar Cells restore battery and end load-shedding · 🔔 Distractions drain battery</div>
  <div><span class="kbd">F</span> full screen · <span class="kbd">M</span> sound · <span class="kbd">P</span> pause</div></div>
  <div class="row"><button class="btn" id="go">▶ Resume</button><button class="ghost fsb" id="fs">⛶ Full screen</button><button class="ghost" id="quit">Quit to title</button></div>`);
 const go=()=>{closeModal();state='play';};card.querySelector('#go').onclick=go;card.querySelector('#fs').onclick=toggleFS;fsIcon();
 card.querySelector('#quit').onclick=()=>{closeModal();L=null;showHUD(false);titleScreen();};mk=e=>{if(e.key==='Enter'||e.key==='Escape'||e.key==='p'||e.key==='P')go();};
}

/* ============ TITLE ============ */
function titleScreen(){
 state='title';showHUD(false);document.documentElement.style.setProperty('--zc',C.teal);
 let best=0;try{best=+localStorage.getItem('etaBest')||0;}catch(e){}
 const card=openModal(`<div class="sub">Digital Skills Course · Midpoint Challenge</div>
  <h1 style="margin-top:8px">ESCAPE THE<br>ALGORITHM</h1>
  <div class="stripe"><i style="background:${C.navy}"></i><i style="background:${C.blue}"></i><i style="background:${C.teal}"></i><i style="background:${C.green}"></i><i style="background:${C.mag}"></i></div>
  <p>A rogue recommendation engine — built to keep people <b>engaged, not informed</b> — has scrambled the first four modules of your course into a labyrinth. Navigate four zones, unlock Knowledge Gates, defeat the Guardians, earn powers and shut it down for good.</p>
  <div class="zgrid">${ZONES.map((z,i)=>`<div class="zg" style="--c:${z.col}"><b>${z.guardian.face} Zone ${i+1}</b>${z.module.split('· ')[1]}</div>`).join('')}</div>
  <input id="nm" maxlength="30" placeholder="Enter your name for your badge" value="${playerName}">
  <div class="row" style="justify-content:center"><button class="btn g big" id="go">▶ START THE MISSION</button><button class="ghost fsb" id="fs" style="color:#fff;border-color:rgba(255,255,255,.4)">⛶ Full screen</button></div>
  ${best?`<p style="font-size:13px">🏅 Best score on this device: <b>${best}</b></p>`:''}
  <details class="howto"><summary>How to play</summary>
  Move with <span class="kbd">↑↓←→</span> / <span class="kbd">WASD</span> or the on-screen pad. Walk into <b>?</b> gates to answer questions — wrong answers drain your 🔋 battery.
  Explore dead ends for power-ups: 🔍 Search Lens, 🛡️ Firewall Shield, 📱 QR Map <span class="kbd">Q</span>, 🔗 URL Shortener <span class="kbd">E</span>, ☀️ Solar Cell.
  Avoid 🔔 Distractions, survive load-shedding, and beat each Guardian's challenge to earn a permanent power. <span class="kbd">F</span> toggles full screen.</details>`,'title');
 fsIcon();
 const go=()=>{playerName=card.querySelector('#nm').value.trim();SFX.power();resetRun();closeModal();bg=[];zoneIntro(0);};
 card.querySelector('#go').onclick=go;card.querySelector('#fs').onclick=toggleFS;mk=e=>{if(e.key==='Enter')go();};
}

titleScreen();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
