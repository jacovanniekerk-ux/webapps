d tech issues happen.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Building a positive attitude toward tech errors and mistakes. Tech issues are normalised. Teachers feel safe to troubleshoot live or laugh off small errors in front of learners without feeling that they are being judged.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Shared resilience. Teachers actively support each other through tech issues. Failures are treated strictly as data to troubleshoot together, not as a reflection of teaching ability.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],Zp=[{level:1,label:"Withdraw",description:"Severe learned helplessness. The teacher feels totally unable to operate software and digital tool and relies completely on the physical presence of an ICT Champ or Lab Coordinator for the simplest tasks.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"Strict step-following. Teachers follow a fixed routine and panic or get completely stuck when unexpected pop-ups or password prompts appear.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Basic self-troubleshooting. Teachers search for answers, check guides, try different browsers, or restart devices before requesting help.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Proactive system ownership. Teachers design custom digital solutions, find apps for everyday tasks, and share local cheat sheets with staff.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],Xp=[{level:1,label:"Withdraw",description:"Total paper reliance. All school documents and notices are physical paper only. Digital spaces are completely unused.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"Total reliance on one or two persons. All tech falls on a single, overworked ICT Lead. If they are away, all digital systems stop working.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Unofficial sharing networks. Teachers use chat groups to swap lesson materials and coordinate schedules, though no formal school platform is set up.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Structured online systems. Shared platforms like Google Workspace or Teams are actively maintained, and teachers co-create lesson plans using online templates.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],Qp=[{level:1,label:"Withdraw",description:"Skipping development. Teachers actively avoid professional development and workshops, feeling burned out and assuming it won't be useful in the classroom.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"Compliance checkbox attendance. Teachers sit silently through mandatory training because SMT demands it. No evidence of these learnings ever shows up inside their classroom lessons.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Active self-learning. Teachers register for optional webinars, courses and complete online micro-learning sessions, and actively try some of the teachings and digital tools in their lessons.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Structured teacher support. Designated teachers mentor their peers through regular check-ins, meetings, classroom visits, and staff developmental sessions.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],Fp=[{level:1,label:"Withdraw",description:"Fear-based rejection. Fears about viruses, tech failure, hacking, or online safety risks keep equipment and technology locked away. Cyber wellness is ignored or treated as too complex to manage.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"Heavy-handed control. Tech is kept under lock and key, with sites blocked and tools restricted. Learners are treated as risks to manage rather than learners to trust.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Teaching digital safety directly. Safe passwords, login habits, and proper online behaviour are built into regular lessons, helping learners learn and follow basic safety rules.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Learner-led peer support. Learner and Teacher ambassadors assist with basic classroom tech setup, teach younger peers about their digital footprints, and lead by example in online ethics.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],$p=[{level:1,label:"Withdraw",description:"Unused classroom tech. Smartboards and projectors sit powered off, while lessons stick strictly to traditional chalkboard lectures.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"One-way slide projection. Tech is used purely to display textbook PDFs or static slides, keeping learners passive as they read from the screen.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Engaging digital practice. Tech provides interactive videos, simulations, or gamified quizzes where learners get instant feedback on their progress.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Learner-led research, collaboration & creation. Technology acts as a launching pad for inquiry and active participation, with learners combining different digital tools to solve problems together.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],Jp=[{level:1,label:"Withdraw",description:"Passive viewing only. Technology stays entirely in the teacher's hands, with learners do not engage with devices, or interactive tools.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"Heavy-handed guidance. Learners interact with tech in a lock-step sequence, with no room to explore, choose their own path, or create original work.",badgeText:"Level 2: Stabilise",colorClass:"#D73828",bgClass:"bg-[#D73828]/5 hover:bg-[#D73828]/10",textClass:"text-[#D73828]",borderClass:"border-[#D73828]/40"},{level:3,label:"Explore",description:"Structured online practice. Learners log in to complete set tasks on learning platforms, answering questions or doing drills where the software guides their progress.",badgeText:"Level 3: Explore",colorClass:"#00A1A3",bgClass:"bg-[#00A1A3]/5 hover:bg-[#00A1A3]/10",textClass:"text-[#00A1A3]",borderClass:"border-[#00A1A3]/20"},{level:4,label:"Lead",description:"Independent or collaborative creation. Learners use tech tools on their own to build, draw, code, write, or create original projects.",badgeText:"Level 4: Lead",colorClass:"#C8126E",bgClass:"bg-[#C8126E]/5 hover:bg-[#C8126E]/10",textClass:"text-[#C8126E]",borderClass:"border-[#C8126E]/20"}],em=[{level:1,label:"Withdraw",description:"One-speed teaching. Lessons push forward at a single pace, with no adjustment or extra time for learners who struggle to keep up.",badgeText:"Level 1: Withdraw",colorClass:"#890C58",bgClass:"bg-[#890C58]/5 hover:bg-[#890C58]/10",textClass:"text-[#890C58]",borderClass:"border-[#890C58]/20"},{level:2,label:"Stabilise",description:"One-click-fits-all pace. The whole class moves screen-b X,We=K,le=ee,Ge=j;if(Q.length>0&&!p.onlyWalkthrough){const w=Q.length;let Ne=0,re=0,Ue=0,rt=0,Lt=0,zt=0;Q.forEach(ot=>{Ne+=ot.pedagogyDesign||1,re+=ot.pedagogyAgency||1,Ue+=ot.pedagogyInclusivity||1,rt+=ot.platformsScheduling||1,Lt+=ot.platformsIntegration||1,zt+=ot.platformsEportal||ot.platformsIntegration||1}),we=Ne/w,Qe=re/w,st=Ue/w,We=rt/w,le=Lt/w,Ge=zt/w}const Te=p.onlyClassroom?0:(se+$)/2,ve=p.onlyClassroom?0:(N+x+G)/3,H=p.onlyWalkthrough?0:(we+Qe+st)/3,M=p.onlyWalkthrough?K:p.onlyClassroom?(le+Ge)/2:(We+le+Ge)/3;let oe=0;p.onlyWalkthrough?oe=(Te+ve+M)/3:p.onlyClassroom?oe=(H+M)/2:oe=(Te+ve+H+M)/4;const ue=(w,Ne)=>{let re="",Ue="";w<=1.5?(re=`The school is operating within the 'Withdraw' digital culture level. Digital change may currently be experienced as pressure rather than opportunity, with low confidence, fatigue, uncertainty or resistance among some staff members. Technology may be available, but its use is limited, inconsistent or mainly focused on administration, presentations and basic teacher-led activities. Leadership may recognise the importance of digital transformation but may not yet have clear structures, roles or routines to support it. Teachers may work largely on their own, with little peer or leadership support or sharing of digital practices, while learners have limited opportunities to use technology actively for learning, collaboration or creation. Existing platforms and devices may also be underused because of access challenges, technical difficulties, low confidence or uncertainty about how they support teaching. Cyber wellness, responsible digital behaviour and online safety may be addressed only when problems arise rather than as part of everyday school culture.

The priority at this level is to rebuild confidence, trust and readiness for digital change. Teachers need patient, practical support, simple entry points, reliable access to basic digital tools and opportunities to experience small successes that reduce anxiety and encourage participation.`,Ue=`Die skool funksioneer binne die 'Withdraw' (Onttrek) digitale kultuurvlak. Digitale verandering word tans moontlik as druk eerder as 'n geleentheid ervaar, met lae selfvertroue, moegheid, onsekerheid of weerstand onder sommige personeellede. Tegnologie mag beskikbaar wees, maar die gebruik daarvan is beperk, inkonsekwent of hoofsaaklik gefokus op administrasie, aanbiedings en basiese onderwyser-geleide aktiwiteite. Skoolleierskap mag die belangrikheid van digitale transformasie erken, maar beskik moontlik nog nie oor duidelike strukture, rolle of roetines om dit te ondersteun nie. Onderwysers werk grootliks op hul eie, met min portuur- of leierskapsondersteuning of deling van digitale praktyke, terwyl leerders beperkte geleenthede het om tegnologie aktief vir leer, samewerking of skepping te gebruik. Bestaande platforms en toestelle word moontlik ook onderbenut weens toegangsuitdagings, tegniese probleme, lae selfvertroue of onsekerheid oor hoe dit onderrig ondersteun. Kuberwelstand, verantwoordelike digitale gedrag en aanlynveiligheid word dikwels slegs aangespreek wanneer probleme opduik, eerder as deel van die alledaagse skoolkultuur.

Die prioriteit op hierdie vlak is om selfvertroue, vertroue en gereedheid vir digitale verandering te herbou. Onderwysers benodig geduldige, praktiese ondersteuning, eenvoudige toetreedrempels, betroubare toegang tot basiese digitale gereedskap en geleenthede om klein suksesse te beleef wat angs verminder en deelname aanmoedig.`):w<=2.5?(re=`The school is operating within the 'Stabilise' digital culture level. There is growing acceptance of technology and greater willingness among staff to use digital tools, although confidence and practice remain uneven across the school. Some teachers are beginning to use technology more regularly for teaching, assessment, communication and administration, while others remain dependent on familiar or traditional approaches. Leadership structures are beginning to support digital practice, but expectations, responsibilities and routines may not yet be consistently understood or applied. Available devices and platforms are being used more often, although their use may still focus on improving existing practices rather than changing how learners engage with learning. Collegial support may be emerging, but digital knowledge often remains concentrated among a small number of confident teachers or ICT champions. Cyber wellness and responsible technology use are increasingly recognised, although these practices may still sit alongside the curriculum rather than being embedded within school culture.

The priority at this level is to build consistency and strengthen everyday practice. Teachers need practical support, shared routines, guidance and learning opportunities to use digital tools confidently as part of normal teaching, assessment, communication and administration.`,Ue=`Die skool funksioneer binne die 'Stabilise' (Stabiliseer) digitale kultuurvlak. Daar is 'n toenemende aanvaarding van tegnologie en 'n groter bereidwilligheid onder personeel om digitale gereedskap te gebruik, alhoewel selfvertroue en praktyk steeds ongelykmatig oor die skool versprei is. Sommige onderwysers begin tegnologie meer gereeld gebruik vir onderrig, assessering, kommunikasie en administrasie, terwyl ander afhanklik bly van bekende of tradisionele benaderings. Leierskapstrukture begin digitale praktyk ondersteun, maar verwagtinge, verantwoordelikhede en roetines word moontlik nog nie konsekwent verstaan of toegepas nie. Beskikbare toestelle en platforms word meer dikwels gebruik, alhoewel die fokus steeds kan wees op die verbetering van bestaande praktyke eerder as om te verander hoe leerders met leer omgaan. Kollegiale ondersteuning begin na vore kom, maar digitale kennis bly dikwels gekonsentreer by 'n klein aantal selfversekerde onderwysers of IKT-kampioene. Kuberwelstand en verantwoordelike tegnologiegebruik word toenemend erken, alhoewel hierdie praktyke moontlik nog langs die kurrikulum staan eerder as om in die skoolkultuur ingebed te wees.

Die prioriteit op hierdie vlak is om konsekwentheid te bou en alledaagse praktyk te versterk. Onderwysers benodig praktiese ondersteuning, gedeelde roetines, leiding en leergeleenthede om digitale gereedskap met selfvertroue te gebruik as deel van normale onderrig, assessering, kommunikasie en administrasie.`):w<=3.5?(re=`The school is operating within the 'Explore' digital culture level. There is visible confidence, curiosity and willingness to experiment with different digital approaches, and examples of strong practice are emerging across classrooms, departments or phases. Teachers are beginning to move beyond basic technology use towards collaboration, learner participation, digital assessment, differentiated learning, research and content creation. Learners have more opportunities to use technology actively rather than simply receive information from a screen. Leadership is increasingly involved in shaping digital priorities and encouraging professional learning, while teachers are beginning to share resources, ideas and experiences with one another. However, strong practice may still depend on particular teachers, champions or departments, and approaches may not yet be consistent across the whole school. Platforms and infrastructure are generally used more purposefully, but the school may still need stronger systems for coordination, monitoring and sharing. Cyber wellness, digital citizenship, AI awareness and responsible online behaviour are beginning to form part of broader teaching and school conversations.

The priority at this level is to deepen practice and connect emerging areas of strength. Teachers need opportunities to collaborate, share successful approaches, experiment with more learner-centred digital practices and build greater consistency across subjects, phases and departments.`,Ue=`Die skool funksioneer binne die 'Explore' (Verken) digitale kultuurvlak. Daar is sigbare selfvertroue, nuuskierigheid en bereidwilligheid om met verskillende digitale benaderings te eksperimenteer, en voorbeelde van sterk praktyk kom na vore oor klaskamers, departemente of fases heen. Onderwysers begin verby basiese tegnologiegebruik beweeg na samewerking, leerderdeelname, digitale assessering, gedifferensieerde leer, navorsing en inhoudskepping. Leerders kry meer geleenthede om tegnologie aktief te gebruik eerder as om net passief inligting vanaf 'n skerm te ontvang. Leierskap is toenemend betrokke by die vorming van digitale prioriteite en die aanmoediging van professionele ontwikkeling, terwyl onderwysers hulpbronne, idees en ervarings met mekaar begin deel. Sterk praktyk kan egter steeds van spesifieke onderwysers, kampioene of departemente afhang, en benaderings is moontlik nog nie konsekwent regoor die hele skool nie. Platforms en infrastruktuur word oor die algemeen meer doelgerig gebruik, maar die skool benodig moontlik steeds sterker stelsels vir koördinering, monitering en deling. Kuberwelstand, digitale burgerskap, KI-bewustheid en verantwoordelike aanlyngedrag begin deel vorm van breër onderrig- en skoolgesprekke.

Die prioriteit op hierdie vlak is om praktyk te verdiep en opkomende areas van sterkte te verbind. Onderwysers benodig geleenthede om saam te werk, suksesvolle benaderings te deel, te eksperimenteer met meer leerdergesentreerde digitale praktyke en groter konsekwentheid oor vakke, fases en departemente heen te bou.`):(re=`The school is operating within the 'Lead' digital culture level. Digital practice is embedded across the institution and forms part of the normal way the school teaches, learns, communicates, manages information and improves its practice. Leadership provides clear direction while responsibility for digital transformation is distributed across teachers, departments and school structures. Teachers confidently select technology according to learning needs and use it to support collaboration, creativity, assessment, differentiation, inquiry and problem solving. Learners are active digital participants who create, investigate, communicate and take increasing responsibility for their learning. Teachers regularly learn from one another, mentor colleagues and adapt their practice based on evidence and reflection. Platforms, devices and digital systems are managed purposefully and support both learning and school operations rather than operating as separate technology initiatives. Cyber wellness, responsible digital citizenship, ethical AI use, professional boundaries and online behaviour form part of the school's wider culture and expectations. The school is also able to document its practice, measure impact and share successful approaches with other schools.

The priority at this level is to sustain strong practice, deepen impact and extend digital leadership. Teachers and school leaders need opportunities to refine innovative practice, strengthen learner agency, use evidence to guide improvement, mentor others and share successful approaches across the wider school community and beyond.`,Ue=`Die skool funksioneer binne die 'Lead' (Lei) digitale kultuurvlak. Digitale praktyk is ingebed regoor die instelling en vorm deel van die normale manier waarop die skool onderrig, leer, kommunikeer, inligting bestuur en sy praktyk verbeter. Leierskap bied duidelike rigting terwyl verantwoordelikheid vir digitale transformasie versprei is oor onderwysers, departemente en skoolstrukture heen. Onderwysers kies tegnologie met selfvertroue volgens leerbehoeftes en gebruik dit om samewerking, kreatiwiteit, assessering, differensiasie, ondersoekende leer en probleemoplossing te ondersteun. Leerders is aktiewe digitale deelnemers wat skep, ondersoek, kommunikeer en toenemende verantwoordelikheid vir hul eie leer aanvaar. Onderwysers leer gereeld van mekaar, tree op as mentors vir kollegas en pas hul praktyk aan op grond van bewyse en refleksie. Platforms, toestelle en digitale stelsels word doelgerig bestuur en ondersteun beide leer en skoolbedrywighede eerder as om as afsonderlike tegnologie-inisiatiewe te funksioneer. Kuberwelstand, verantwoordelike digitale burgerskap, etiese KI-gebruik, professionele grense en aanlyngedrag vorm deel van die skool se breër kultuur en verwagtinge. Die skool is ook in staat om sy praktyk te dokumenteer, impak te meet en suksesvolle benaderings met ander skole te deel.

Die prioriteit op hierdie vlak is om sterk praktyk te handhaaf, impak te verdiep en digitale leierskap uit te brei. Onderwysers en skoolleiers benodig geleenthede om innoverende praktyk te verfyn, leerder-agentskap te versterk, bewyse te gebruik om verbetering te rig, ander te mentor en suksesvolle benaderings met die breër skoolgemeenskap en verder te deel.`);const rt=[],Lt=[];c.infrastructure.slimLabs&&(rt.push("SLIM Smart Labs"),Lt.push("SLIM Smart Rekenaarlokale")),c.infrastructure.catItEgdLabs&&(rt.push("CAT/IT/EGD Computer Labs"),Lt.push("RTT/IT/IGO rekenaarlokale")),c.infrastructure.internetConnection&&(rt.push("functional Internet connectivity"),Lt.push("werkende internetverbinding")),c.infrastructure.smartClassroom&&(rt.push("Smart Classroom setups"),Lt.push("Slimklaskamer-hulpbronne"));let zt="",ot="";rt.length>0?(zt=`With physical access to ${rt.join(", ")}, the hardware foundation is robust; however, converting physical infrastructure into active pedagogical flow requires lowering academic performance anxieties.`,ot=`Met toegang tot ${Lt.join(", ")}, is die fisiese hulpbronne gevestig; die oorgang na aktiewe pedagogiese integrasie vereis egter dat akademiese angs verlaag word.`):(zt="The lack of established, high-capacity hardware assets indicates that digital integration must focus on offline-first resources, high-impact administrative shortcuts, and teacher-centric mobile workflows.",ot="Die gebrek aan hoë-kapasiteit hardeware bates beteken dat digitale rypwording moet fokus op vanlyn-eerste platforms en onderwyser-sentriese selfoon-werkstrome.");let il="",sl="";const ql=p.teacherName?Ne?`teacher ${p.teacherName}`:`onderwyser ${p.teacherName}`:"",Zl=p.subjectObserved?Ne?` in ${p.subjectObserved}`:` in ${p.subjectObserved}`:"",lt=p.gradeObserved?Ne?` (Grade ${p.gradeObserved})`:` (Graad ${p.gradeObserved})`:"",Xl=p.lessonTopic?Ne?`, delivering a lesson on '${p.lessonTopic}',`:`, wat 'n les oor '${p.lessonTopic}' aanbied,`:"";(ql||Zl||Xl)&&(il=`During the walkthrough with ${ql||"the teacher"}${Zl}${lt}${Xl} we captured valuable field highlights: `,sl=`Tydens die klaskamerbesoek met ${ql||"die onderwyser"}${Zl}${lt}${Xl} is waardevolle veldinligting vasgevang: `);let ca="",da="";const rl=p.toolsUsed&&p.toolsUsed!=="N/A"&&p.toolsUsed.trim()!=="",cs=p.artifactVerified&&p.artifactVerified!=="N/A"&&p.artifactVerified.trim()!=="";rl?(ca+=`The current implementation of "${p.toolsUsed}" `,da+=`Die huidige gebruik van "${p.toolsUsed}" `):(ca+="The absence of active digital tools during current lessons ",da+="Die gebrek aan aktiewe digitale hulpmiddels in huidige lesse "),cs?(ca+=`is coupled with a verified Learner Digital Artefact ("${p.artifactVerified}"). This serves as undeniable, high-quality proof of active learner agency and hands-on digital creation rather than passive observation. `,da+=`is gekoppel aan 'n geverifieerde digitale werkstuk deur leerders ("${p.artifactVerified}"). Dit dien as onweerlegbare bewys van leerder-agentskap en skeppende tegnologieverbruik deur die leerders self. `):(ca+="indicates that lesson engagement remains centred on teacher-delivery. Shifting from whiteboards to requiring learners to compile their own digital artefacts is the key strategic recommendation to bridge this gap. ",da+="dui daarop dat lesbetrokkenheid onderwysersentries bly. Die oorgang van projeksieborde na praktiese leerder-skeppings is die belangrikste aanbeveling om hierdie gaping te oorbrug. ");let ua="",Ya="";const fa=[];c.activeProjects.mco&&fa.push("MCO (Maths)"),c.activeProjects.backOnTrack&&fa.push("Back-on-Track"),c.activeProjects.other&&c.activeProjects.otherValue&&fa.push(c.activeProjects.otherValue),fa.length>0&&(ua+=`As part of the active WCED ${fa.join(" and ")} intervention, `,Ya+=`As deel van die aktiewe NKOD behoeftes van ${fa.join(" en ")}, `),p.teacherUpskilling&&p.teacherUpskilling!=="N/A"&&p.teacherUpskilling.trim()!==""&&(ua+=`the teacher upskilling milestone ("${p.teacherUpskilling}") is highly strategic. `,Ya+=`is die onderwyser se professionalisering-doelwit ("${p.teacherUpskilling}") strategies hoogs belyn. `),p.advisorSupport&&p.advisorSupport!=="N/A"&&p.advisorSupport.trim()!==""?(ua+=`To execute the in-class suggestions ("${p.advisorSupport}"), focus must shift entirely from compliance oversight to high-reward technical wins that protect teacher wellness.`,Ya+=`Om die inklas-ondersteuning ("${p.advisorSupport}") suksesvol uit te voer, moet die fokus verskuif na lae-risiko sielkundige suksesse wat onderwyser-welstand beskerm.`):(ua+="Nurturing this ecosystem demands continuous, low-pressure support rather than administrative audits.",Ya+="Om hierdie ekosisteem te koester, vereis dit deurlopende ondersteuning met lae druk in plaas van administratiewe oudits.");const Oa=[il,ca,ua].filter(Boolean).join("").trim(),nt=[sl,da,Ya].filter(Boolean).join("").trim(),Yt=Oa?`${re}

${ot} ${nt}`:Ue;return Ne?Yt:ct},[q,E]=xe.useState("en"),O=(w=>w<=1.5?{levelNum:1,name:"Withdraw",nameAfr:"Onttrek",tagline:"Low trust, uncertainty, fatigue and limited digital readiness",taglineAfr:"Lae vertroue, onsekerheid, moegheid en beperkte digitale gereedheid",levelKey:"Withdraw",color:"#890C58",headerColor:"text-[#890C58]",bannerBg:"bg-[#890C58]",bannerText:"text-white",pillBg:"bg-[#890C58]/10 text-[#890C58] border-[#890C58]/30",cardBg:"bg-[#890C58]/5 border-[#890C58]/20",cardBorder:"border-[#890C58]/30",badgeBg:"bg-[#890C58]/10 text-[#890C58] border-[#890C58]/30",lightBg:"bg-fuchsia-50/50",accentBorder:"border-l-4 border-l-[#890C58]",ruleNumBg:"bg-[#890C58] text-white",ruleTitleColor:"text-[#890C58]",bgClass:"bg-[#890C58]/10 text-[#890C58] border-[#890C58]/20",description:"Prioritise psychological safety and basic user confidence. SMT should foster trust and support staff on emotional levels before mandating compliance targets.",descriptionAfr:"Prioritiseer sielkundige veiligheid en basiese gebruikervertroue. Die bestuurspan (SMT) moet eers emosionele ondersteuning bied voordat harde doelwitte afgedwing word.",affectiveDiagnosisContext:ue(w,!0),affectiveDiagnosisContextAfr:ue(w,!1),strategicMatrix:{title:"Strategic Matrix: Operational Evidence to Affective & Cultural Insight : Withdrawal",titleAfr:"Strategiese Matriks: Operasionele Bewyse na Affektiewe & Kulturele Insig : Onttrekking",operationalSignals:"Low or irregular use of available technology; limited transfer from training into classroom practice; learner digital participation is minimal; digital expertise may depend on one or two people; equipment or platforms may remain underused.",operationalSignalsAfr:"Lae of onreëlmatige gebruik van beskikbare tegnologie; beperkte oordrag van opleiding na klaskamerpraktyk; minimale leerder digitale deelname; digitale kundigheid hang af van een of twee persone; toerusting of platforms bly onderbenut.",affectiveInsight:"The pattern may indicate low confidence, fatigue, uncertainty, poor previous experiences, weak support or a sense that digital change is being imposed rather than owned.",affectiveInsightAfr:"Die patroon dui moontlik op lae selfvertroue, moegheid, onsekerheid, swak vorige ervarings, beperkte ondersteuning of 'n gevoel dat digitale verandering afgedwing word eerder as eienaarskap geneem word.",affectiveReading:"Low trust, uncertainty, fatigue, anxiety, dependency and limited readiness.",affectiveReadingAfr:"Lae vertroue, onsekerheid, moegheid, angs, afhanklikheid en beperkte gereedheid."},advisoryCheck:{question:"What is driving the low participation?",questionAfr:"Wat dryf die lae deelname?",detail:"Check whether the barrier is confidence, workload, access, technical difficulty, previous negative experiences, unclear expectations or lack of support.",detailAfr:"Kyk of die hindernis selfvertroue, werkslading, toegang, tegniese probleme, vorige negatiewe ervarings, onduidelike verwagtinge of gebrek aan ondersteuning is."},criticalAdvisoryLens:`Operational data may show low device use, limited participation, poor platform activity or little evidence of digital integration, but these figures do not explain why staff are disengaging. Low participation may be linked to fatigue, fear of failure, previous negative experiences, limited confidence, weak support or a sense that technology creates more work.

The advisor should therefore avoid interpreting low activity as simple resistance or non-compliance. Support should first rebuild trust, reduce pressure and create manageable opportunities for teachers to experience success. At this level, understanding the human barrier is as important as addressing the technical one.`,criticalAdvisoryLensAfr:`Operasionele data toon moontlik lae toestelgebruik, beperkte deelname, minimale platformaktiwiteit of min bewyse van digitale integrasie, maar hierdie syfers verduidelik nie waarom personeel ontkoppel nie. Lae deelname kan gekoppel wees aan moegheid, vrees vir mislukking, vorige negatiewe ervarings, beperkte selfvertroue, swak ondersteuning of 'n gevoel dat tegnologie ekstra werkslading skep.

Die adviseur moet dus vermy om lae aktiwiteit as blote weerstand of nienakoming te interpreteer. Ondersteuning moet eers vertroue herbou, druk verminder en hanteerbare geleenthede skep vir onderwysers om sukses te ervaar. Op hierdie vlak is begrip vir die menslike hindernis net so belangrik as die hantering van die tegniese hindernis.`,strategicActionRules:[{num:"1",rule:"Support Before Scrutiny",ruleAfr:"Ondersteuning Voor Ondersoek",text:"Keep the walk low-pressure and supportive. Look for barriers, uncertainty and small signs of participation rather than focusing first on what is missing.",textAfr:"Hou die besoek lae-druk en ondersteunend. Soek na hindernisse, onsekerheid en klein tekens van deelname eerder as om dadelik te fokus op wat ontbreek."},{num:"2",rule:"Simplify Before Expanding",ruleAfr:"Vereenvoudig Voor Uitbreiding",text:"Focus on one or two practical digital practices that teachers can use confidently before introducing additional tools, platforms or expectations.",textAfr:"Fokus op een of twee praktiese digitale praktyke wat onderwysers met selfvertroue kan gebruik voordat bykomende gereedskap, platforms of verwagtinge ingestel word."},{num:"3",rule:"Notice the Small Wins",ruleAfr:"Erken die Klein Sukseste",text:"Identify and affirm small examples of progress, even where they appear basic. Use these successes to rebuild confidence and willingness to try again.",textAfr:"Identifiseer en bevestig klein voorbeelde van vordering, selfs al lyk dit basies. Gebruik hierdie suksesse om selfvertroue en bereidwilligheid om weer te probeer, te herbou."}],measuresOfSupport:[{title:"Strategic Direction and Practice",titleAfr:"Strategiese Rigting en Praktyk",text:"Reduce pressure and simplify expectations. Leadership should focus on a small number of achievable digital priorities, remove unnecessary compliance demands and create safe opportunities for teachers to begin using technology in ways that respond to immediate classroom and administrative needs.",textAfr:"Verminder druk en vereenvoudig verwagtinge. Leierskap moet fokus op 'n klein aantal haalbare digitale prioriteite, onnodige nakomingsvereistes verwyder en veilige geleenthede skep vir onderwysers om tegnologie te begin gebruik op maniere wat reageer op onmiddellike klaskamer- en administratiewe behoeftes."},{title:"Peer Learning and Collaboration",titleAfr:"Portuurleer en Samewerking",text:"Create safe opportunities for teachers to learn from others without judgement. Pair staff with supportive peers, Transformation Agents or suitable neighbouring schools where they can observe simple, achievable digital practices and discuss challenges openly.",textAfr:"Skep veilige geleenthede vir onderwysers om sonder veroordeling van ander te leer. Koppel personeel aan ondersteunende porture, Transformasie-agente of geskikte buurskole waar hulle eenvoudige, haalbare digitale praktyke kan waarneem en uitdagings openlik kan bespreek."},{title:"Building Confidence and Capability",titleAfr:"Bou van Selfvertroue en Vaardigheid",text:"Rebuild trust and confidence through low-risk experiences. Teachers need patient support, simple tools, practical demonstrations and opportunities to experience small successes without fear of failure, comparison or excessive monitoring.",textAfr:"Herbou vertroue en selfvertroue deur laerisiko-ervarings. Onderwysers benodig geduldige ondersteuning, eenvoudige gereedskap, praktiese demonstrasies en geleenthede om klein suksesse te beleef sonder vrees vir mislukking, vergelyking of oormatige monitering."},{title:"Platform and Digital Enablement",titleAfr:"Platform- en Digitale Bemagtiging",text:"Address the basic barriers that prevent participation. The school should establish what devices, connectivity, platforms and technical support are available, resolve critical access problems and focus teachers on a small number of reliable tools rather than introducing additional platforms.",textAfr:"Spreek die basiese hindernisse aan wat deelname verhoed. Die skool moet vasstel watter toestelle, konnektiwiteit, platforms en tegniese ondersteuning beskikbaar is, kritieke toegangsprobleme oplos en onderwysers fokus op 'n klein aantal betroubare gereedskap eerder as om bykomende platforms bekend te stel."},{title:"Cyber Wellness and Digital Citizenship",titleAfr:"Kuberwelstand en Digitale Burgerskap",text:"Establish basic safety, trust and responsible-use foundations. Teachers and learners need clear guidance on online safety, privacy, digital behaviour and appropriate technology use, while support should address anxiety, harmful experiences and uncertainty around digital participation.",textAfr:"Vestig basiese fondamente van veiligheid, vertroue en verantwoordelike gebruik. Onderwysers en leerders benodig duidelike leiding oor aanlynveiligheid, privaatheid, digitale gedrag en toepaslike tegnologiegebruik, terwyl ondersteuning angs, skadelike ervarings en onsekerheid rondom digitale deelname moet aanspreek."}]}:w<=2.5?{levelNum:2,name:"Stabilise",nameAfr:"Stabiliseer",tagline:"Growing confidence, cautious participation, increasing trust and emerging collective responsibility",taglineAfr:"Groeiende selfvertroue, versigtige deelname, toenemende vertroue en ontluikende kollektiewe verantwoordelikheid",levelKey:"Stabilise",color:"#D73828",headerColor:"text-[#D73828]",bannerBg:"bg-[#D73828]",bannerText:"text-white",pillBg:"bg-red-50 text-red-900 border-red-200",cardBg:"bg-red-50/40 border-red-200",cardBorder:"border-red-200",badgeBg:"bg-red-100 text-red-900 border-red-300",lightBg:"bg-red-50/40",accentBorder:"border-l-4 border-l-[#D73828]",ruleNumBg:"bg-[#D73828] text-white",ruleTitleColor:"text-[#D73828]",bgClass:"bg-red-50 text-red-900 border-red-200",description:"Incorporate organic teacher groups. Move lessons away from static, teacher-focused projection routines and towards active, learner-facing engagement.",descriptionAfr:"Motiveer informele portuurgroepe. Verskuif lesse van passiewe, onderwyser-sentriese projeksies na aktiewe en interaktiewe leerder-deelname.",affectiveDiagnosisContext:ue(w,!0),affectiveDiagnosisContextAfr:ue(w,!1),strategicMatrix:{title:"Strategic Matrix: Operational Evidence to Affective & Cultural Insight : Stabilise",titleAfr:"Strategiese Matriks: Operasionele Bewyse na Affektiewe & Kulturele Insig : Stabiliseer",operationalSignals:"Technology use is increasing but remains uneven; common routines are beginning to emerge; professional development participation is improving; teachers still depend on confident colleagues for support; learner use remains inconsistent.",operationalSignalsAfr:"Tegnologiegebruik neem toe maar bly ongelyk; algemene roetines begin posvat; deelname aan professionele ontwikkeling verbeter; onderwysers steun steeds op selfversekerde kollegas vir ondersteuning; leerdergebruik bly wisselvallig.",affectiveInsight:"The school may be developing trust and confidence but still needs predictability, reassurance and repeated opportunities to practise before digital use feels normal.",affectiveInsightAfr:"Die skool ontwikkel moontlik vertroue en selfvertroue, maar benodig steeds voorspelbaarheid, gerusstelling en herhaalde oefengeleenthede voordat digitale gebruik normaal voel.",affectiveReading:"Growing confidence, cautious participation, increasing trust, need for reassurance and emerging collective responsibility.",affectiveReadingAfr:"Groeiende selfvertroue, versigtige deelname, toenemende vertroue, behoefte aan gerusstelling en ontluikende kollektiewe verantwoordelikheid."},advisoryCheck:{question:"What is becoming stable, and where does confidence still depend on support?",questionAfr:"Wat word stabiel, en waar hang selfvertroue steeds af van ondersteuning?",detail:"Check which routines teachers can manage independently and where they still need reassurance, coaching or peer assistance.",detailAfr:"Kyk watter roetines onderwysers onafhanklik kan bestuur en waar hulle steeds gerusstelling, afrigting of portuurhulp benodig."},criticalAdvisoryLens:`Operational data may begin to show increased use of devices, platforms and digital tools, but participation is likely to remain uneven. Some teachers may be progressing confidently while others continue to depend on familiar routines or more experienced colleagues.

The advisor should look beyond whether technology is being used and consider how secure and sustainable that use has become. Teachers may still need reassurance, clear routines, practical support and repeated opportunities to practise before digital use feels normal rather than additional.

Support should therefore strengthen consistency without creating unnecessary pressure or introducing too much complexity too quickly.`,criticalAdvisoryLensAfr:`Operasionele data kan begin wys dat die gebruik van toestelle, platforms en digitale gereedskap toeneem, maar deelname bly waarskynlik ongelyk. Sommige onderwysers vorder met selfvertroue terwyl ander steeds afhanklik is van bekende roetines of meer ervare kollegas.

Die adviseur moet verder kyk as bloot of tegnologie gebruik word en oorweeg hoe veilig en volhoubaar daardie gebruik geword het. Onderwysers benodig moontlik steeds gerusstelling, duidelike roetines, praktiese ondersteuning en herhaalde oefengeleenthede voordat digitale gebruik normaal eerder as addisioneel voel.

Ondersteuning moet dus konsekwentheid versterk sonder om onnodige druk te skep of te veel kompleksiteit te vinnig in te stel.`,strategicActionRules:[{num:"1",rule:"Consistency Before Complexity",ruleAfr:"Konsekwentheid Voor Kompleksiteit",text:"Look for digital practices that are beginning to work and help teachers repeat them consistently across lessons, departments or school routines.",textAfr:"Soek na digitale praktyke wat begin werk en help onderwysers om dit konsekwent oor lesse, departemente of skoolroetines heen te herhaal."},{num:"2",rule:"Coach Within Everyday Practice",ruleAfr:"Afrigting Binne Alledaagse Praktyk",text:"Support teachers inside the work they are already doing, including planning, assessment, communication and classroom teaching, rather than adding separate digital tasks.",textAfr:"Ondersteun onderwysers binne die werk wat hulle reeds doen, insluitend beplanning, assessering, kommunikasie en klaskameronderrig, eerder as om aparte digitale take by te voeg."},{num:"3",rule:"Build Peer Confidence",ruleAfr:"Bou Portuur-selfvertroue",text:"Identify teachers who can support colleagues and encourage simple peer demonstrations, shared planning and practical exchange of ideas.",textAfr:"Identifiseer onderwysers wat kollegas kan ondersteun en moedig eenvoudige portuur-demonstrasies, gedeelde beplanning en praktiese uitruil van idees aan."}],measuresOfSupport:[{title:"Strategic Direction and Practice",titleAfr:"Strategiese Rigting en Praktyk",text:"Establish clear expectations and consistent everyday routines. Leadership should identify common digital practices for teaching, assessment, communication and administration, while ensuring that teachers understand what is expected and have the support required to participate confidently.",textAfr:"Vestig duidelike verwagtinge en konsekwente alledaagse roetines. Leierskap moet algemene digitale praktyke vir onderrig, assessering, kommunikasie en administrasie identifiseer, terwyl verseker word dat onderwysers verstaan wat verwag word en die nodige ondersteuning het om met selfvertroue deel te neem."},{title:"Peer Learning and Collaboration",titleAfr:"Portuurleer en Samewerking",text:"Develop regular internal peer support. Establish buddy systems, informal demonstrations and shared planning opportunities that allow more confident teachers to support colleagues and reduce dependence on external assistance.",textAfr:"Ontwikkel gereelde interne portuur-ondersteuning. Vestig 'buddy'-stelsels, informele demonstrasies en gedeelde beplanningsgeleenthede wat meer selfversekerde onderwysers toelaat om kollegas te ondersteun en afhanklikheid van eksterne hulp te verminder."},{title:"Building Confidence and Capability",titleAfr:"Bou van Selfvertroue en Vaardigheid",text:"Strengthen practical digital capability through regular use. Professional development should focus on the tools and practices teachers need for everyday teaching, assessment, communication and administration, supported by coaching and opportunities to practise.",textAfr:"Versterk praktiese digitale vaardighede deur gereelde gebruik. Professionele ontwikkeling moet fokus op die gereedskap en praktyke wat onderwysers benodig vir alledaagse onderrig, assessering, kommunikasie en administrasie, ondersteun deur afrigting en oefengeleenthede."},{title:"Platform and Digital Enablement",titleAfr:"Platform- en Digitale Bemagtiging",text:"Create consistency in how available platforms and devices are used. Teachers need clear guidance on which tools support teaching, assessment, communication and administration, together with reliable access, simple procedures and appropriate technical support.",textAfr:"Skep konsekwentheid in hoe beskikbare platforms en toestelle gebruik word. Onderwysers benodig duidelike leiding oor watter gereedskap onderrig, assessering, kommunikasie en administrasie ondersteun, tesame met betroubare toegang, eenvoudige prosedures en toepaslike tegniese ondersteuning."},{title:"Cyber Wellness and Digital Citizenship",titleAfr:"Kuberwelstand en Digitale Burgerskap",text:"Develop consistent expectations and everyday cyber wellness practices. Digital boundaries, responsible behaviour, professional conduct and learner safety should become visible in classroom routines, school communication and the responsible use of devices and platforms.",textAfr:"Ontwikkel konsekwente verwagtinge en alledaagse kuberwelstandspraktyke. Digitale grense, verantwoordelike gedrag, professionele optrede en leerderveiligheid moet sigbaar word in klaskamerroetines, skoolkommunikasie en die verantwoordelike gebruik van toestelle en platforms."}]}:w<=3.5?{levelNum:3,name:"Explore",nameAfr:"Verken",tagline:"Curiosity, agency, confidence, experimentation and growing digital ownership",taglineAfr:"Nuuskierigheid, agentskap, selfvertroue, eksperimentering en groeiende digitale eienaarskap",levelKey:"Explore",color:"#00A1A3",headerColor:"text-[#00A1A3]",bannerBg:"bg-[#00A1A3]",bannerText:"text-white",pillBg:"bg-teal-50 text-teal-800 border-teal-300",cardBg:"bg-teal-50/40 border-teal-200",cardBorder:"border-teal-300",badgeBg:"bg-teal-50 text-teal-800 border-teal-300",lightBg:"bg-teal-50/40",accentBorder:"border-l-4 border-l-[#00A1A3]",ruleNumBg:"bg-[#00A1A3] text-white",ruleTitleColor:"text-[#00A1A3]",bgClass:"bg-teal-50 text-teal-800 border-teal-300",description:"Embed systemic structures. Solidify enthusiastic digital practices by introducing structured files and common G-Suite/Teams workflows into standard planning.",descriptionAfr:"Vestig stelselmatige werkstrome. Konsolideer entoesiastiese digitale praktyke deur G-Suite of Teams formeel in weeklikse vakbeplannings te integreer.",affectiveDiagnosisContext:ue(w,!0),affectiveDiagnosisContextAfr:ue(w,!1),strategicMatrix:{title:"Strategic Matrix: Operational Evidence to Affective & Cultural Insight : Explore",titleAfr:"Strategiese Matriks: Operasionele Bewyse na Affektiewe & Kulturele Insig : Verken",operationalSignals:"Strong digital practice is visible in several classrooms or departments; teachers are experimenting; learners increasingly create and collaborate digitally; peer sharing is growing; some areas of the school remain stronger than others.",operationalSignalsAfr:"Sterk digitale praktyk is sigbaar in verskeie klaskamers of departemente; onderwysers eksperimenteer; leerders skep en werk toenemend digitaal saam; portuurdeling groei; sommige areas van die skool bly sterker as ander.",affectiveInsight:"The school is showing confidence, curiosity and agency, but progress may still depend on particular champions. The need now is connection, recognition and greater shared ownership.",affectiveInsightAfr:"Die skool toon selfvertroue, nuuskierigheid en agentskap, maar vordering hang moontlik steeds af van individuele kampioene. Die behoefte nou is konneksie, erkenning en groter gedeelde eienaarskap.",affectiveReading:"Curiosity, agency, confidence, experimentation, professional pride, collaboration and growing ownership.",affectiveReadingAfr:"Nuuskierigheid, agentskap, selfvertroue, eksperimentering, professionele trots, samewerking en groeiende eienaarskap."},advisoryCheck:{question:"How widely is strong practice actually shared?",questionAfr:"Hoe wyd word sterk praktyk werklik gedeel?",detail:"Check whether progress is becoming part of the school culture or remains dependent on particular teachers, departments or champions.",detailAfr:"Kyk of vordering deel word van die skoolkultuur of afhanklik bly van spesifieke onderwysers, departemente of kampioene."},criticalAdvisoryLens:`Operational evidence may show growing platform use, stronger learner participation and more examples of digital teaching and learning. However, the data may hide the fact that much of this progress is being driven by a small number of confident teachers, departments or champions.

The advisor should identify where energy and innovation already exist and how these strengths can be shared across the school. At this stage, support should move away from basic tool training and towards collaboration, pedagogical experimentation, teacher agency and opportunities for staff to learn from one another.

The key risk is no longer resistance, but good practice remaining isolated.`,criticalAdvisoryLensAfr:`Operasionele bewyse toon moontlik toenemende platformgebruik, sterker leerderdeelname en meer voorbeelde van digitale onderrig en leer. Die data kan egter verswyg dat baie van hierdie vordering gedryf word deur 'n klein groepie selfversekerde onderwysers, departemente of kampioene.

Die adviseur moet identifiseer waar energie en innovasie reeds bestaan en hoe hierdie sterktes oor die hele skool gedeel kan word. Op hierdie stadium moet ondersteuning wegbeweeg van basiese gereedskapopleiding na samewerking, pedagogiese eksperimentering, onderwyser-agentskap en geleenthede vir personeel om van mekaar te leer.

Die primêre risiko is nie meer weerstand nie, maar dat goeie praktyk geïsoleer bly.`,strategicActionRules:[{num:"1",rule:"Connect Before Scaling",ruleAfr:"Verbind Voor Skalering",text:"Identify strong practice already happening in classrooms or departments and create opportunities for it to be shared across the school.",textAfr:"Identifiseer sterk praktyk wat reeds in klaskamers of departemente plaasvind en skep geleenthede om dit oor die hele skool te deel."},{num:"2",rule:"Deepen Learner Agency",ruleAfr:"Verdiep Leerder-agentskap",text:"Look beyond teacher use of technology and focus increasingly on what learners are doing, creating, questioning, collaborating and solving through digital learning.",textAfr:"Kyk verder as onderwysergebruik van tegnologie en fokus toenemend op wat leerders doen, skep, bevraagteken, saamwerk en oplos deur digitale leer."},{num:"3",rule:"Turn Pockets into Practice",ruleAfr:"Omskep Enklawes in Praktyk",text:"Help the school move successful digital approaches from individual teachers into shared planning, routines and departmental or whole-school practice.",textAfr:"Help die skool om suksesvolle digitale benaderings van individuele onderwysers oor te dra na gedeelde beplanning, roetines en departementele of skoolwye praktyk."}],measuresOfSupport:[{title:"Strategic Direction and Practice",titleAfr:"Strategiese Rigting en Praktyk",text:"Strengthen and connect successful practice across the school. Leadership should identify what is already working, build it into departmental and subject planning, and create greater consistency so that effective digital practice is no longer dependent on individual teachers.",textAfr:"Versterk en verbind suksesvolle praktyke oor die hele skool. Leierskap moet identifiseer wat reeds werk, dit in departementele en vakbeplanning inbou, en groter konsekwentheid skep sodat doeltreffende digitale praktyk nie meer afhanklik is van individuele onderwysers nie."},{title:"Peer Learning and Collaboration",titleAfr:"Portuurleer en Samewerking",text:"Build structured professional collaboration within and beyond the school. Teachers should share resources, demonstrate effective practice, co-design learning activities and participate in subject, circuit or district communities where digital practice can be exchanged and strengthened.",textAfr:"Bou gestruktureerde professionele samewerking binne en buite die skool. Onderwysers moet hulpbronne deel, doeltreffende praktyk demonstreer, gesamentlike leeraktiwiteite ontwerp en deelneem aan vak-, kring- of distriksgemeenskappe waar digitale praktyk uitgeruil en versterk kan word."},{title:"Building Confidence and Capability",titleAfr:"Bou van Selfvertroue en Vaardigheid",text:"Develop teacher agency, experimentation and professional judgement. Teachers should be encouraged to test new approaches, adapt technology to learner needs, reflect on what works and increasingly share their knowledge with colleagues.",textAfr:"Ontwikkel onderwyser-agentskap, eksperimentering en professionele oordeel. Onderwysers moet aangemoedig word om nuwe benaderings te toets, tegnologie by leerderbehoeftes aan te pas, te reflekteer oor wat werk en toenemend hul kennis met kollegas te deel."},{title:"Platform and Digital Enablement",titleAfr:"Platform- en Digitale Bemagtiging",text:"Move from access towards purposeful and integrated use. Platforms should increasingly support collaboration, learner creation, assessment, differentiated learning and resource sharing, while the school reviews where infrastructure or access gaps still limit effective practice.",textAfr:"Beweeg vanaf toegang na doelgerigte en geïntegreerde gebruik. Platforms moet toenemend samewerking, leerderskepping, assessering, gedifferensieerde leer en hulpbrondeling ondersteun, terwyl die skool hersien waar infrastruktuur- of toegangsgapings steeds doeltreffende praktyk beperk."},{title:"Cyber Wellness and Digital Citizenship",titleAfr:"Kuberwelstand en Digitale Burgerskap",text:"Embed cyber wellness into learning and wider school culture. Teachers should integrate digital citizenship, online behaviour, AI awareness, digital empathy and responsible decision-making into relevant curriculum areas, while learners begin taking more active roles in awareness and peer support.",textAfr:"Bed kuberwelstand in by leer en die breër skoolkultuur. Onderwysers moet digitale burgerskap, aanlyngedrag, KI-bewustheid, digitale empatie en verantwoordelike besluitneming in relevante kurrikulumareas integreer, terwyl leerders meer aktiewe rolle in bewusmaking en portuur-ondersteuning begin inneem."}]}:{levelNum:4,name:"Lead",nameAfr:"Lei",tagline:"Ownership, autonomy, distributed leadership and systemic digital transformation",taglineAfr:"Eienaarskap, outonomie, verspreide leierskap en stelselmatige digitale transformasie",levelKey:"Lead",color:"#C8126E",headerColor:"text-[#C8126E]",bannerBg:"bg-[#C8126E]",bannerText:"text-white",pillBg:"bg-pink-50 text-pink-800 border-pink-300",cardBg:"bg-pink-50/40 border-pink-200",cardBorder:"border-pink-300",badgeBg:"bg-pink-50 text-pink-800 border-pink-300",lightBg:"bg-pink-50/40",accentBorder:"border-l-4 border-l-[#C8126E]",ruleNumBg:"bg-[#C8126E] text-white",ruleTitleColor:"text-[#C8126E]",bgClass:"bg-pink-50 text-pink-800 border-pink-300",description:"Lighthouse standard. Empower teachers as school-wide mentors. Shares custom learner-created artefacts and supports neighbouring schools in surrounding circuits.",descriptionAfr:"Baken-instelling. Bemagtig onderwysers as skool-wye mentors. Deel eie skeppende digitale werksmetodes en fasiliteer groter streeks-ondersteuning.",affectiveDiagnosisContext:ue(w,!0),affectiveDiagnosisContextAfr:ue(w,!1),strategicMatrix:{title:"Strategic Matrix: Operational Evidence to Affective & Cultural Insight : Lead",titleAfr:"Strategiese Matriks: Operasionele Bewyse na Affektiewe & Kulturele Insig : Lei",operationalSignals:"Digital practice is consistent across the school; expertise is distributed; learners participate actively and independently; teachers mentor one another; systems support teaching, learning and administration; the school can share practice with others.",operationalSignalsAfr:"Digitale praktyk is konsekwent regoor die skool; kundigheid is versprei; leerders neem aktief en onafhanklik deel; onderwysers mentor mekaar; stelsels ondersteun onderrig, leer en administrasie; die skool kan praktyk met ander deel.",affectiveInsight:"The school demonstrates collective confidence, ownership and professional autonomy. Support should recognise this maturity rather than return the school to compliance-driven intervention.",affectiveInsightAfr:"Die skool demonstreer kollektiewe selfvertroue, eienaarskap en professionele outonomie. Ondersteuning moet hierdie volwassenheid erken eerder as om terug te keer na nakomingsgedrewe intervensies.",affectiveReading:"Ownership, autonomy, collective confidence, distributed leadership, reflective practice and responsibility for others.",affectiveReadingAfr:"Eienaarskap, outonomie, kollektiewe selfvertroue, verspreide leierskap, reflektiewe praktyk en verantwoordelikheid vir ander."},advisoryCheck:{question:"What evidence shows meaningful impact rather than simply high activity?",questionAfr:"Watter bewyse toon betekenisvolle impak eerder as bloot hoë aktiwiteit?",detail:"Check learner experience, quality of teaching, sustainability, staff ownership, equity and whether the school can maintain and share its practice independently.",detailAfr:"Kyk na leerderervaring, kwaliteit van onderrig, volhoubaarheid, personeeleienaarskap, billikheid en of die skool sy praktyk onafhanklik kan handhaaf en deel."},criticalAdvisoryLens:`Operational data may show strong and consistent technology use, high levels of digital participation and embedded practice across the institution. At this level, however, high activity alone should not be treated as proof of meaningful transformation.

The advisor should look for quality, learner agency, sustainability, reflective practice and evidence of impact. A Lead school should not require the same level of directive support as a developing school. Excessive monitoring or compliance requirements may actually limit the professional ownership that has enabled the school to progress.

Support should therefore create space for innovation, mentoring, reflection and contribution to the wider system.`,criticalAdvisoryLensAfr:`Operasionele data kan sterk en konsekwente tegnologiegebruik, hoë vlakke van digitale deelname en ingebedde praktyk regoor die instelling toon. Op hierdie vlak moet hoë aktiwiteit alleen egter nie as bewys van betekenisvolle transformasie beskou word nie.

Die adviseur moet soek na gehalte, leerder-agentskap, volhoubaarheid, reflektiewe praktyk en bewyse van impak. 'n Leier-skool behoort nie dieselfde vlak van voorskriftelike ondersteuning as 'n ontwikkelende skool te benodig nie. Oormatige monitering of voldoeningsvereistes kan juis die professionele eienaarskap beperk wat die skool in staat gestel het om te vorder.

ources, give feedback and support one another through purposeful digital activities."},{level:4,label:"Lead",desc:"Collaboration is embedded naturally in the lesson. Learners organise shared work, contribute different strengths, provide meaningful peer support and collectively create or solve problems using technology."}],evidence:["Paired or group work on shared Google Docs, interactive whiteboards, or co-created presentations.","Division of roles within learner groups (researcher, editor, presenter) using digital platforms.","Peer review and feedback comments exchanged digitally between learners."],probes:["How do learners co-construct answers or projects using the classroom devices?","Is digital technology facilitating teamwork or isolating learners in isolated drill exercises?"]},{id:"classroom-cyber-wellness",scope:"classroom",category:"pedagogy",title:"Classroom: Cyber Wellness Integration into Subject Learning",icon:i.jsx(Po,{className:"w-4 h-4 text-[#00A1A3]"}),objective:"How meaningfully are digital citizenship, cyber wellness, ethics, and online safety woven into subject lesson activities and learner tasks?",levels:[{level:1,label:"Withdraw",desc:"No visible connection is made between the subject lesson and cyber wellness, responsible digital behaviour or the learner's online experience, even where the lesson creates a natural opportunity for it."},{level:2,label:"Stabilise",desc:"Cyber wellness is mentioned when relevant, usually through reminders about online safety, responsible behaviour, privacy or appropriate technology use, but remains separate from the main learning activity."},{level:3,label:"Explore",desc:"Cyber wellness is purposefully connected to the subject content through discussion, examples, activities or reflection, helping learners consider issues such as digital identity, online behaviour, misinformation, AI use, digital empathy or wellbeing within the learning context."},{level:4,label:"Lead",desc:"Cyber wellness is naturally embedded into subject learning where relevant. Learners critically examine digital choices, behaviour, ethics and wellbeing, apply these ideas to authentic subject-based tasks, and demonstrate responsible judgement within their own digital participation and creation."}],evidence:["Explicit discussions on source credibility, copyright, citation of online images, and fact-checking.","Conversations around digital footprint, AI ethics, cyber etiquette, and respectful communication in chats.","Subject-aligned ethical problem-solving (e.g. evaluating fake science news or bias in online historical accounts)."],probes:["How did this lesson guide learners to verify the authenticity and copyright of online information?","Were digital etiquette and respectful online interaction modelled or discussed during peer activities?"]},{id:"classroom-platform-access",scope:"classroom",category:"platforms",title:"Classroom: Tool Access Mechanics & ePortal Integration",icon:i.jsx(To,{className:"w-4 h-4 text-[#C8126E]"}),objective:"How easily can teachers and learners access and use the available digital tools during the lesson?",levels:[{level:1,label:"Withdraw",desc:"Learners and teachers experience significant friction or complete barrier when trying to access digital devices, log in, or load ePortal resources during the lesson."},{level:2,label:"Stabilise",desc:"Devices and basic tools are accessible, but setups require extensive manual intervention or only a few learners have working connectivity/accounts."},{level:3,label:"Explore",desc:"Digital tools and ePortal resources are accessed smoothly by all learners, with minimal downtime and clear login routines."},{level:4,label:"Lead",desc:"Seamless, equitable digital access is completely embedded in the classroom routine with zero friction, multi-device support, and self-sufficient learner access."}],evidence:["Time required from entering the room/starting the lesson to active device engagement (under 3 minutes is optimal).","Functional state of learner logins, SSO credentials, and ePortal / CAPS digital material availability.","Smooth multi-device management without persistent device shortage disruptions."],probes:["How many instructional minutes are lost to initial login and device setup routines?","Are learners able to access and download WCED ePortal curriculum resources directly?"]},{id:"safety",scope:"school",category:"people",title:"1. School: Psychological Safety & Wellbeing",icon:i.jsx(wo,{className:"w-4 h-4 text-[#890C58]"}),objective:"Measure the stress response and risk-tolerance of teachers when digital tools fail during live instruction.",levels:[{level:1,label:"Withdraw",desc:"Fear, immediate stress, and operational defeat. Technical glitches trigger visible distress, causing the teacher to shut down equipment, apologise, and retreat back into static paper/chalk work."},{level:2,label:"Stabilise",desc:"Technology is only used to tick management's boxes; it is avoided or feared when unexpected tech issues happen."},{level:3,label:"Explore",desc:"Building a positive attitude toward tech errors and mistakes. Tech issues are normalised. Teachers feel safe to troubleshoot live or laugh off small errors in front of learners without feeling that they are being judged."},{level:4,label:"Lead",desc:"Shared resilience. Teachers actively support each other through tech issues. Failures are treated strictly as data to troubleshoot together, not as a reflection of teaching ability."}],evidence:["Observations of teacher response during unexpected Wi-Fi drops, login blocks, or projector freezes.","General classroom climate—whether learners tease or support the teacher during micro-failures.","School Management Team (SMT) messaging: Is technology supported through high-pressure inspection or collaborative security?"],probes:["What happens in your classroom when the system logs you off unexpectedly mid-lesson?","Do you feel that SMT evaluates your worth as a teacher on how neatly a presentation runs?"]},{id:"confidence",scope:"school",category:"people",title:"2. School: Digital Confidence & Agency",icon:i.jsx(os,{className:"w-4 h-4 text-[#890C58]"}),objective:"Evaluate the teacher's capability to drive digital learning setups independently without requiring constant external handholding.",levels:[{level:1,label:"Withdraw",desc:"Severe learned helplessness. The teacher feels totally unable to operate software and digital tool and relies completely on the physical presence of an ICT Champ or Lab Coordinator for the simplest tasks."},{level:2,label:"Stabilise",desc:"Strict step-following. Teachers follow a fixed routine and panic or get completely stuck when unexpected pop-ups or password prompts appear."},{level:3,label:"Explore",desc:"Basic self-troubleshooting. Teachers search for answers, check guides, try different browsers, or restart devices before requesting help."},{level:4,label:"Lead",desc:"Proactive system ownership. Teachers design custom digital solutions, find apps for everyday tasks, and share local cheat sheets with staff."}],evidence:["Are teachers capable of self-loading software, logging in, and adjusting basic sound/display outputs alone?","Do they show curiosity to try unmandated features on WCED platforms, or do they only execute directives?"],probes:["When an app asks you to 'Allow Permissions' or select a sound input, what is your immediate course of action?","How do you share custom shortcuts with your colleagues?"]},{id:"collab",scope:"school",category:"practices",title:"3. School: Collaboration & Staff Rituals",icon:i.jsx(nl,{className:"w-4 h-4 text-[#D73828]"}),objective:"Assess if ICT sharing and resources happen in organic team rituals or remain bottlenecked behind single players.",levels:[{level:1,label:"Withdraw",desc:"Total paper reliance. All school documents and notices are physical paper only. Digital spaces are completely unused."},{level:2,label:"Stabilise",desc:"Total reliance on one or two persons. All tech falls on a single, overworked ICT Lead. If they are away, all digital systems stop working."},{level:3,label:"Explore",desc:"Unofficial sharing networks. Teachers use chat groups to swap lesson materials and coordinate schedules, though no formal school platform is set up."},{level:4,label:"Lead",desc:"Structured online systems. Shared platforms like Google Workspace or Teams are actively maintained, and teachers co-create lesson plans using online templates."}],evidence:["Are school-wide lesson planning structures and tracking templates accessible concurrently to departments?","What happens when the designated ICT Champion is on sick leave? Do digital practices continue or stop?"],probes:["Where does a new teacher at this school go to find previous lesson worksheets and assessment models?","If you discover a great digital resource, how does it reach the rest of your grade?"]},{id:"pd",scope:"school",category:"practices",title:"4. School: Professional Development & Learning",icon:i.jsx(jo,{className:"w-4 h-4 text-[#D73828]"}),objective:"Analyse if digital upskilling is driven by compliance quotas or genuine pedagogical absorption.",levels:[{level:1,label:"Withdraw",desc:"Skipping development. Teachers actively avoid professional development and workshops, feeling burned out and assuming it won't be useful in the classroom."},{level:2,label:"Stabilise",desc:"Compliance checkbox attendance. Teachers sit silently through mandatory training because SMT demands it. No evidence of these learnings ever shows up inside their classroom lessons."},{level:3,label:"Explore",desc:"Active self-learning. Teachers register for optional webinars, courses and complete online micro-learning sessions, and actively try some of the teachings and digital tools in their lessons."},{level:4,label:"Lead",desc:"Structured teacher support. Designated teachers mentor their peers through regular check-ins, meetings, classroom visits, and staff developmental sessions."}],evidence:["Logins and progress levels on WCED e-learning portals or standard training courses.","Observation of actual trained techniques translated from theory into active classroom layouts."],probes:["When was the last time you attended an ICT workshop, and what is one small technique you successfully tried with your learners afterwards?","Do teachers here organise informal mutual help desks for peer upskilling?"]},{id:"cyber",scope:"school",category:"practices",title:"5. School: Cyber Wellness & Digital Citizenship",icon:i.jsx(lO,{className:"w-4 h-4 text-[#D73828]"}),objective:"Determine if digital safety is managed via fearful restriction and policing or smart, preventative citizenship.",levels:[{level:1,label:"Withdraw",desc:"Fear-based rejection. Fears about viruses, tech failure, hacking, or online safety risks keep equipment and technology locked away. Cyber wellness is ignored or treated as too complex to manage."},{level:2,label:"Stabilise",desc:"Heavy-handed control. Tech is kept under lock and key, with sites blocked and tools restricted. Learners are treated as risks to manage rather than learners to trust."},{level:3,label:"Explore",desc:"Teaching digital safety directly. Safe passwords, login habits, and proper online behaviour are built into regular lessons, helping learners learn and follow basic safety rules."},{level:4,label:"Lead",desc:"Learner-led peer support. Learner and Teacher ambassadors assist with basic classroom tech setup, teach younger peers about their digital footprints, and lead by example in online ethics."}],evidence:["Rules posted in labs: Are they empowering guidelines or written in aggressive, threatening tones?","Do lessons incorporate conversations around digital identity, copyright, and correct citation models?"],probes:["How do you address cyberbullying or digital plagiarism disputes among your learners?","Are learners allowed to suggest online resources, or are they restricted strictly to a rigid list?"]},{id:"lesson",scope:"school",category:"pedagogy",title:"6. School: Lesson Design & Digital Integration",icon:i.jsx(rs,{className:"w-4 h-4 text-[#00A1A3]"}),objective:"Evaluate how technology changes the actual instructional delivery and learning pathways across the curriculum.",levels:[{level:1,label:"Withdraw",desc:"Unused classroom tech. Smartboards and projectors sit powered off, while lessons stick strictly to traditional chalkboard lectures."},{level:2,label:"Stabilise",desc:"One-way slide projection. Tech is used purely to display textbook PDFs or static slides, keeping learners passive as they read from the screen."},{level:3,label:"Explore",desc:"Engaging digital practice. Tech provides interactive videos, simulations, or gamified quizzes where learners get instant feedback on their progress."},{level:4,label:"Lead",desc:"Learner-led research, collaboration & creation. Technology acts as a launching pad for inquiry and active participation, with learners combining different digital tools to solve problems together."}],evidence:["Are lesson plans systematically noting the use of interactive apps, videos, or web databases?","Are learners actively thinking through resources, or are they just looking at screens?"],probes:["How does using the smartboard or projector change how your learners take notes or answer questions?","Can you plan a lesson where technology is the main tool for problem solving?"]},{id:"agency",scope:"school",category:"pedagogy",title:"7. School: Learner Agency & Artefacts",icon:i.jsx(Wl,{className:"w-4 h-4 text-[#00A1A3]"}),objective:"Evaluate if technology is touched exclusively by the teacher or if learners are building actual digital output across grades.",levels:[{level:1,label:"Withdraw",desc:"Passive viewing only. Technology stays entirely in the teacher's hands, with learners do not engage with devices, or interactive tools."},{level:2,label:"Stabilise",desc:"Heavy-handed guidance. Learners interact with tech in a lock-step sequence, with no room to explore, choose their own path, or create original work."},{level:3,label:"Explore",desc:"Structured online practice. Learners log in to complete set tasks on learning platforms, answering questions or doing drills where the software guides their progress."},{level:4,label:"Lead",desc:"Independent or collaborative creation. Learners use tech tools on their own to build, draw, code, write, or create original projects."}],evidence:["Can the school present digital portfolios of learner work (slide shows, spreadsheet experiments, typed essays)?","During lab visits, who is driving the mouse or keyboard? (Is it mainly the teacher or the learners?)"],probes:["In a typical ICT lab session, what do your learners actually produce by the time the bell rings?","Have your learners ever generated a digital slide show to explain a complex topic to the class?"]},{id:"inclusivity",scope:"school",category:"pedagogy",title:"8. School: Cognitive Inclusivity & Differentiation",icon:i.jsx(nl,{className:"w-4 h-4 text-[#00A1A3]"}),objective:"Assess if technology accommodates the different paces and development needs of individual learners across the school.",levels:[{level:1,label:"Withdraw",desc:"One-speed teaching. Lessons push forward at a single pace, with no adjustment or extra time for learners who struggle to keep up."},{level:2,label:"Stabilise",desc:"One-click-fits-all pace. The whole class moves screen-by-screen together, causing panic for those who need extra time and boredom for those who don't."},{level:3,label:"Explore",desc:"Differentiated learning paths. Digital lessons offer distinct options so quick learners can jump to challenge activities while struggling learners access guided practice."},{level:4,label:"Lead",desc:"Dynamic personalised paths. AI or adaptive software automatically adjusts lesson difficulty in real time based on learner performance."}],evidence:["Do lessons incorporate alternative content formats (e.g. text-to-speech, visual diagrams, video tutorials) for different learners?","Are learners permitted to work at their own pace inside curriculum software?"],probes:["How do you assist a learner who gets stuck on an earlier level while others have finished?","Are you utilising digital platforms to check understanding instantly and group learners accordingly?"]},{id:"scheduling",scope:"school",category:"platforms",title:"9. School: Resource Scheduling & Access Mechanics",icon:i.jsx(fp,{className:"w-4 h-4 text-[#C8126E]"}),objective:"Inspect the scheduling hygiene that determines if ICT spaces and laptop trolleys are active daily or kept locked.",levels:[{level:1,label:"Withdraw",desc:"Zero tech access. Computer rooms are kept locked, with no timetable, leaving equipment gathering dust while classes never use the space."},{level:2,label:"Stabilise",desc:"Guarded scheduling. Lab access is strictly gatekept and rarely available for regular lessons, saved mostly for testing, admin, and/or specific projects only."},{level:3,label:"Explore",desc:"Shared timetable access. Equipment and labs are booked on a clear schedule, giving multiple grades and classes steady, weekly access."},{level:4,label:"Lead",desc:"Always-accessible learning spaces. Labs run on seamless, flexible scheduling, allowing learners and classes full access anytime for lessons, projects, or self-study."}],evidence:["The physical booking diary or calendar: Are there multiple entries per day across different subject areas?","Are the physical doors open and active when you perform the walkthrough, or are they padlocked?"],probes:["How many times did your specific class use the ICT lab or tablet cart during the past month?","Is booking managed on a fair, self-service platform, or are there priority barriers?"]},{id:"integration",scope:"school",category:"platforms",title:"10. School: Digital Tool & Portal Integration",icon:i.jsx(ko,{className:"w-4 h-4 text-[#C8126E]"}),objective:"Analyse the school's structural adoption of official platforms (e.g., WCED ePortal, CAPS digital content, Mathematics apps).",levels:[{
