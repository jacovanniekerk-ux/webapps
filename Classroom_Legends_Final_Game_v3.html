<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Legends · Digital Skills Final Challenge</title>
<style>
:root{--navy:#001489;--blue:#007DBA;--teal:#00A1A3;--green:#8FAD15;--mag:#C8126E;--ink:#0b1440;--cw:clamp(100px,min(11.6vw,25vh),172px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Century Gothic','Futura','Avenir Next','Trebuchet MS',Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 15% 0%,#0a2bd6 0%,#001489 38%,#000a3d 85%)}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,161,163,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,161,163,.07) 1px,transparent 1px);background-size:44px 44px;animation:grid 30s linear infinite;pointer-events:none}
@keyframes grid{to{background-position:44px 44px}}
button{font-family:inherit;cursor:pointer;border:0}
#top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(0,10,61,.82);z-index:10}
#top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#001489,#007DBA,#00A1A3,#8FAD15,#C8126E)}
.logo{font-weight:900;letter-spacing:.06em;font-size:17px;white-space:nowrap}
.logo span{color:#7fe3e4}
.pill{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
.hb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.hb:hover{background:rgba(255,255,255,.28)}
#screen{position:fixed;top:58px;left:0;right:0;bottom:0;overflow:auto}
.panel{background:#fff;color:var(--ink);border-radius:24px;padding:24px 30px;max-width:1040px;margin:22px auto;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.panel h1{color:var(--navy);font-size:clamp(27px,4.4vw,44px);line-height:1.05}
.panel h2{color:var(--navy);font-size:clamp(19px,2.4vw,25px);margin:6px 0 12px;line-height:1.3}
.panel p{line-height:1.5;margin:8px 0;font-size:16px}
.tag{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:800;font-size:17px;padding:13px 23px;border-radius:14px;box-shadow:0 6px 18px rgba(0,20,137,.35);transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.g{background:linear-gradient(135deg,var(--green),var(--teal))}
.btn.m{background:linear-gradient(135deg,var(--mag),var(--navy))}
.btn.big{font-size:20px;padding:15px 28px}
.ghost{background:transparent;color:var(--navy);font-weight:700;font-size:15px;padding:10px 15px;border-radius:12px;border:2px solid #dbe4f3}
.dark .ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.title{background:radial-gradient(circle at 25% 0%,#0b2bd0,#001489 45%,#000a3d);color:#fff;text-align:center}
.title h1{color:#fff;font-size:clamp(34px,6.4vw,64px);text-shadow:0 0 30px rgba(0,161,163,.8);letter-spacing:.03em}
.title .sub{font-weight:800;letter-spacing:.18em;font-size:13px;color:#7fe3e4;text-transform:uppercase}
.title p{color:#dfe7ff}
.title input{font-family:inherit;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;width:min(360px,100%);text-align:center;outline:none}
.title input::placeholder{color:#b8c4f0}
.fan{display:flex;justify-content:center;margin:18px 0 12px;--cw:116px;height:176px}
.fan .card{margin:0 -14px;cursor:default}
.fan .card:nth-child(1){transform:rotate(-14deg) translateY(16px)}.fan .card:nth-child(2){transform:rotate(-7deg) translateY(4px)}
.fan .card:nth-child(4){transform:rotate(7deg) translateY(4px)}.fan .card:nth-child(5){transform:rotate(14deg) translateY(16px)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0;text-align:left}
.rules div{background:rgba(255,255,255,.08);border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.45;border-left:4px solid var(--c)}
.rules b{display:block;font-size:16px;margin-bottom:2px}
.map{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 0;margin:18px 0}
.node{width:74px;height:74px;border-radius:50%;background:var(--mg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.25);flex:none}
.node small{font-size:10px;letter-spacing:.06em}
.node.done{opacity:.55}.node.done::after{content:'✓';position:absolute;bottom:-4px;right:-4px;background:var(--green);border-radius:50%;width:24px;height:24px;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.node.cur{animation:pulse 1.2s infinite;outline:4px solid #fff;outline-offset:3px}
.node.lock{filter:grayscale(1);opacity:.35}
@keyframes pulse{50%{transform:scale(1.1)}}
.link{width:20px;height:4px;background:#dbe4f3;flex:none}
/* cards */
.card{position:relative;flex:none;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:15px;background:#fff;color:var(--ink);overflow:hidden;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s,opacity .2s;display:flex;flex-direction:column;border:3px solid #fff}
.card .band{height:40%;background:var(--mg);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.32);position:relative;flex:none}
.card .cost{position:absolute;top:5px;left:5px;width:calc(var(--cw)*.22);height:calc(var(--cw)*.22);border-radius:50%;background:#fff;color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.13);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.card .cost::after{content:'⏱';position:absolute;bottom:-5px;right:-6px;font-size:calc(var(--cw)*.08)}
.card .mt{position:absolute;top:6px;right:6px;font-size:calc(var(--cw)*.08);font-weight:800;background:rgba(255,255,255,.28);padding:1px 5px;border-radius:6px;color:#fff}
.card .key{position:absolute;bottom:4px;right:7px;font-size:calc(var(--cw)*.085);font-weight:800;color:#fff;opacity:.85}
.card .nm{font-weight:900;font-size:calc(var(--cw)*.104);line-height:1.12;padding:6px 6px 2px;text-align:center}
.card .st{font-weight:900;font-size:calc(var(--cw)*.096);text-align:center;color:var(--navy);margin:1px 0}
.card .fl{font-size:calc(var(--cw)*.079);line-height:1.26;padding:3px 7px;text-align:center;color:#3a4670}
.hand .card:hover,.pick .card:hover{transform:translateY(-12px) scale(1.04);box-shadow:0 16px 30px rgba(0,0,0,.45)}
.card.dim{filter:grayscale(.75);opacity:.55}
.card.legend{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#C8126E,#00A1A3,#8FAD15) border-box}
.card.legend .band::before{content:'LEGENDARY';position:absolute;bottom:3px;font-size:calc(var(--cw)*.068);letter-spacing:.15em;font-weight:900;color:#fff}
.card.junk .band{background:repeating-linear-gradient(45deg,#C8126E,#C8126E 8px,#9d0d56 8px,#9d0d56 16px)}
.card.sel{border-color:var(--green);box-shadow:0 0 0 4px rgba(143,173,21,.65),0 12px 26px rgba(0,0,0,.4);transform:translateY(-8px)}
.card.hint{animation:glow .9s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px #8FAD15,0 0 30px #8FAD15}}
.card.played{animation:playfx .32s forwards;pointer-events:none}
@keyframes playfx{to{transform:translateY(-220px) scale(.5) rotate(-8deg);opacity:0}}
.pick{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0;--cw:clamp(118px,12.5vw,168px)}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;--cw:clamp(112px,10vw,136px);margin:12px 0}
.grid .card{cursor:pointer}.grid.nopick .card{cursor:default}
/* battle: crisis + coach side by side */
#battle{display:flex;flex-direction:column;height:100%;padding:10px 14px 6px;gap:8px}
.cw{flex:none;display:flex;gap:12px;align-items:stretch}
.crisis{flex:1.55;min-width:0;background:linear-gradient(135deg,rgba(200,18,110,.28),rgba(0,20,137,.55));border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:12px 18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.crisis.boss{background:linear-gradient(135deg,rgba(200,18,110,.55),rgba(30,5,70,.8));border-color:#C8126E;box-shadow:0 0 40px rgba(200,18,110,.5)}
.cface{font-size:clamp(50px,6.5vw,88px);animation:flt 2.4s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(200,18,110,.8));flex:none}
@keyframes flt{50%{transform:translateY(-8px) rotate(-4deg)}}
.crisis.hit .cface{animation:hitfx .45s}
@keyframes hitfx{0%{filter:brightness(4)}30%{transform:translate(-12px,4px) rotate(-12deg)}60%{transform:translate(10px,-3px) rotate(9deg)}}
.cinfo{flex:1;min-width:0}
.mtag2{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;margin:0 6px 4px 0}
.cname{font-size:clamp(20px,2.4vw,29px);font-weight:900;line-height:1.15}
.ctext{font-size:clamp(14px,1.25vw,17px);line-height:1.4;opacity:.95;margin:5px 0 9px}
.hp{position:relative;height:22px;border-radius:12px;background:rgba(255,255,255,.16);overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#C8126E,#ff5fae);transition:width .45s}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.intent{display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--mag);font-weight:800;border-radius:12px;padding:6px 12px;font-size:14.5px}
.ask{background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-radius:12px;padding:7px 12px;font-size:14.5px}
.ask:disabled{opacity:.35;cursor:default}
.coach{flex:1;min-width:0;position:relative;background:#fff;color:var(--ink);border-radius:20px;border-left:8px solid var(--blue);font-size:clamp(14px,1.2vw,16.5px);line-height:1.45}
.coach .in{position:absolute;inset:12px 16px;overflow:auto;animation:pop .3s}
.coach b.h{display:block;font-size:1.1em;margin-bottom:4px}
.coach.s{border-left-color:var(--green)}.coach.b{border-left-color:var(--mag)}.coach.n{border-left-color:#9aa6c4}
.coach .sm{font-size:.88em;color:#4a5680;margin-top:6px}
.pbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mor{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:12px;font-weight:700;font-size:15.5px}
.mbar{width:clamp(80px,14vw,180px);height:14px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#8FAD15,#00A1A3);transition:width .4s}
.orbs{display:flex;gap:5px;align-items:center;background:rgba(255,255,255,.12);padding:6px 11px;border-radius:12px;font-weight:700;font-size:15.5px}
.orb{width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#00A1A3 60%);box-shadow:0 0 10px #00A1A3}
.orb.off{opacity:.18;box-shadow:none}
.endt{background:linear-gradient(135deg,var(--mag),#8d0b4d);color:#fff;font-weight:900;font-size:17px;padding:12px 24px;border-radius:14px;box-shadow:0 0 18px rgba(200,18,110,.6)}
.endt:disabled{opacity:.4}
.hand{display:flex;justify-content:safe center;align-items:flex-start;gap:9px;min-height:calc(var(--cw)*1.42 + 20px);padding:16px 4px 4px;overflow-x:auto;overflow-y:hidden;flex:1}
.flt{position:fixed;font-weight:900;font-size:clamp(20px,3vw,34px);pointer-events:none;z-index:50;text-shadow:0 3px 0 rgba(0,10,61,.8),0 0 20px rgba(0,0,0,.5);animation:up 1.3s forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-90px}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;animation:fl .45s forwards}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}
#ov{position:fixed;inset:0;background:rgba(0,10,61,.75);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
#ov.show{display:flex}
#ov .panel{margin:0;max-height:94vh;overflow:auto;width:100%}
.debrief{list-style:none;display:grid;gap:8px;margin:10px 0}
.debrief li{background:#f1f5fc;border-radius:12px;padding:9px 13px;font-size:15px;line-height:1.4;border-left:5px solid var(--green)}
.debrief li.bk{border-left-color:var(--mag);background:#fdeef5}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#f1f5fc;color:var(--ink);font-size:16.5px;padding:13px 15px;border-radius:14px;border:2px solid #dbe4f3;font-weight:600;line-height:1.35;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(4px);background:#fff}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt.ok{background:#eef6d6;border-color:var(--green)}.opt.ok .k{background:var(--green)}
.opt.bad{background:#fbe3ef;border-color:var(--mag)}.opt.bad .k{background:var(--mag)}
.fb{margin-top:12px;padding:13px 15px;border-radius:14px;line-height:1.45;font-size:16px}
.fb.ok{background:#f2f8e2;border-left:6px solid var(--green)}.fb.bad{background:#fdeef5;border-left:6px solid var(--mag)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.choice{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:16px;font-weight:800;font-size:18px;text-align:center}
.choice div{font-size:36px}.choice span{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px}
.choice:hover{transform:translateY(-3px)}
.preview{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#C8126E,#001489);color:#fff;border-radius:18px;padding:14px 18px;margin:10px 0}
.preview .e{font-size:58px}
.preview b{font-size:21px}
.preview p{font-size:15px!important;margin:4px 0!important;color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}
.sgrid div{background:#f1f5fc;border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:700;color:#4a5680}
.sgrid b{display:block;font-size:26px;color:var(--navy)}
.badge{width:194px;height:194px;margin:6px auto;border-radius:50%;background:conic-gradient(#001489,#007DBA,#00A1A3,#8FAD15,#C8126E,#001489);display:flex;align-items:center;justify-content:center;animation:spin 8s linear infinite;box-shadow:0 0 40px rgba(0,161,163,.6)}
.badge>div{width:160px;height:160px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spin 8s linear infinite reverse;color:var(--navy);text-align:center;padding:10px}
.badge .e{font-size:50px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);z-index:60;background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;border-left:6px solid var(--teal)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{margin-left:10px;background:var(--navy);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700}
.kbd{display:inline-block;background:#eef2fa;color:var(--navy);border:1px solid #c9d3ea;border-radius:6px;padding:0 6px;font-weight:800;font-size:.9em}
@media (max-width:860px){
 .cw{flex-direction:column}.crisis{padding:10px 12px}.coach{flex:none;height:150px}
 .cface{font-size:46px}.logo{display:none}#top .pill.hide-s{display:none}
 :root{--cw:118px}.panel{padding:18px;margin:12px}.choices{grid-template-columns:1fr}
 #battle{height:auto;min-height:100%}
}
@media (max-height:680px) and (min-width:861px){:root{--cw:clamp(96px,24vh,140px)}.ctext{font-size:13.5px}.cface{font-size:48px}.cname{font-size:20px}}
</style>
</head>
<body>
<div id="top">
  <div class="logo">🃏 CLASSROOM <span>LEGENDS</span></div>
  <div class="pill" id="tChap">Final Challenge</div>
  <div style="flex:1"></div>
  <div class="pill" id="tMor" style="display:none"></div>
  <div class="pill hide-s" id="tScore">⭐ 0</div>
  <button class="hb" id="bDeck" title="View deck">🗂️</button>
  <button class="hb" id="bMute" title="Sound (M)">🔊</button>
  <button class="hb" id="bFS" title="Full screen (F)">⛶</button>
</div>
<div id="screen"></div>
<div id="ov"></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const MODS=['Starter','Introduction & Background','Digital Teaching & Learning Environment','Digital Content','Managing Learning','Cloud-based Collaboration','Digital Assessment','Learner-centred Approaches'];
const MC={0:['#5d6fa3','linear-gradient(135deg,#4b5b8f,#8d9cc7)'],1:['#001489','linear-gradient(135deg,#001489,#2a46d8)'],2:['#007DBA','linear-gradient(135deg,#007DBA,#29a8e0)'],3:['#C8126E','linear-gradient(135deg,#C8126E,#e8559c)'],4:['#8FAD15','linear-gradient(135deg,#6f8a0c,#a9c72b)'],5:['#00A1A3','linear-gradient(135deg,#00A1A3,#2fd0d2)'],6:['#001489','linear-gradient(135deg,#001489,#C8126E)'],7:['#00A1A3','linear-gradient(135deg,#8FAD15,#00A1A3)']};

const CARDS={
 chalk:{m:0,n:'Chalk & Talk',e:'📢',c:1,p:4,t:'Classic teacher-centred delivery.'},
 plan:{m:0,n:'Lesson Plan',e:'📝',c:1,b:5,t:'Prepare for what’s coming.'},
 worksheet:{m:0,n:'Printed Worksheet',e:'📄',c:1,p:3,t:'Reliable… but paper-bound.'},
 coffee:{m:0,n:'Staffroom Coffee',e:'☕',c:0,d:1,h:2,t:'A moment to regroup.'},
 tpack:{m:1,n:'TPACK Alignment',e:'🧩',c:2,p:6,b:3,t:'Technology + Pedagogy + Content, together.'},
 objectives:{m:1,n:'Clear Learning Objectives',e:'🎯',c:1,p:5,t:'Let the outcome drive the tool.'},
 mobilefirst:{m:1,n:'Mobile-First Design',e:'📱',c:1,p:5,t:'Built for the device learners actually have.'},
 datalite:{m:1,n:'Data-Conscious Content',e:'📉',c:1,p:4,b:2,t:'Low-bandwidth, offline-friendly resources.'},
 scaffold:{m:1,n:'Structured Scaffolding',e:'🪜',c:1,p:4,b:3,t:'Teach autonomy step by step.'},
 samr:{m:1,n:'SAMR: Redefinition',e:'🚀',c:3,p:11,r:'l',t:'Create tasks that were previously inconceivable.'},
 qr:{m:2,n:'QR Code',e:'🔳',c:0,p:3,t:'Scan. Open. Done.'},
 playlist:{m:2,n:'Curated Playlist',e:'📺',c:1,p:5,t:'Embed the exact videos, not the algorithm.'},
 station:{m:2,n:'Charging Station',e:'🔌',c:1,b:6,t:'Powered devices, every lesson.'},
 cleanup:{m:2,n:'30-Second Clean-up',e:'🧹',c:0,b:3,d:1,t:'Close tabs, clear downloads, back on the charger.'},
 groups:{m:2,n:'Group Device Stations',e:'👥',c:2,p:7,t:'3 devices can engage 20 learners.'},
 wowapp:{m:2,n:'Shiny New App',e:'✨',c:1,p:7,trap:1,t:'So exciting! So new! So… necessary?'},
 canva:{m:3,n:'Canva for Education',e:'🎨',c:2,p:7,t:'Simple, versatile, collaborative design.'},

}

function intentInfo(){const k=B.pat[B.pi%B.pat.length],v=B.atk;
 if(k==='atk')return {k,p:v,txt:`⚔️ Next: Pressure ${v}`};
 if(k==='distract')return {k,p:Math.max(2,v-3),txt:`🔔 Next: 2 Distractions + Pressure ${Math.max(2,v-3)}`};
 return {k,p:Math.max(2,v-2),txt:`⚡ Next: Load-shedding (−1 ⏱) + Pressure ${Math.max(2,v-2)}`};}
function upd(){
 if(!B||!$('#battle'))return;
 $('#hpb').style.width=(B.hp/B.max*100)+'%';$('#hpt').textContent=`Crisis ${B.hp} / ${B.max}`;
 $('#intent').textContent=intentInfo().txt;$('#ask').disabled=!B.ask;
 $('#mb').style.width=(G.morale/G.max*100)+'%';$('#mt').textContent=`${G.morale}/${G.max}`;
 $('#prep').textContent=`🛡️ Prep ${B.prep}`;
 $('#orbs').innerHTML='⏱ '+Array.from({length:Math.max(3,B.time)},(_,i)=>`<i class="orb ${i<B.time?'':'off'}"></i>`).join('');
 $('#piles').textContent=`🂠 ${B.draw.length} · 🗑 ${B.disc.length}`;
 const cb=$('#combo');cb.style.display=B.combo>1?'':'none';cb.textContent=`🔥 Combo ×${B.combo}`;
 $('#hand').innerHTML=B.hand.map((h,i)=>cardHTML(h,{dim:stat(h).c>B.time,key:i<9?i+1:''})).join('');

function drawN(n){for(let i=0;i<n;i++){if(!B.draw.length){if(!B.disc.length)break;B.draw=shuffle(B.disc);B.disc=[];}if(B.hand.length>=10)break;B.hand.push(B.draw.pop());}}
function startTurn(){B.prep=0;B.time=Math.max(1,3-B.drain);B.drain=0;B.combo=0;B.turns++;drawN(5);B.busy=false;upd();}
function play(uid){
 if(!B||B.busy)return;
 const i=B.hand.findIndex(h=>h.uid===uid);if(i<0)return;
 const inst=B.hand[i],c=CARDS[inst.id],s=stat(inst);
 if(s.c>B.time){toast('⏱ Not enough time this turn. End your turn to recover.');SFX.bad();return;}
 B.busy=true;B.time-=s.c;const me=B;
 const el=document.querySelector(`#hand .card[data-uid="${uid}"]`);if(el)el.classList.add('played');SFX.card();
 setTimeout(()=>{
  if(B!==me)return;
  B.hand.splice(i,1);
  if(c.junk){coach('n',`<b class="h">🔔 Distraction dismissed</b>Notifications and autoplay are designed to keep users engaged, not informed. Dismiss them before they drain you.`);B.busy=false;upd();return;}
  const rel=B.c.s[inst.id]?'s':B.c.b[inst.id]?'b':'n';
  const counts=s.p>0||rel!=='n';
  let dmg=0;
  if(rel==='s'){B.combo++;dmg=Math.max(s.p,4)*2+(B.combo>1?(B.combo-1)*2:0);}
  else if(rel==='n'){dmg=Math.ceil(s.p/2);if(counts)B.combo=0;}
  else{B.combo=0;}
  if(rel!=='b'){B.prep+=s.b;if(s.h)G.morale=Math.min(G.max,G.morale+s.h);}
  if(s.d)drawN(s.d);
  B.hp=Math.max(0,B.hp-dmg);
  if(counts){G.st[{s:'strong',n:'neutral',b:'back'}[rel]]++;B.bs[rel]++;}
  const cr=$('#cr');
  if(rel==='s'){SFX.strong();addScore(100+(B.combo>1?25*(B.combo-1):0));cr.classList.remove('hit');void cr.offsetWidth;cr.classList.add('hit');flash('rgba(143,173,21,.35)');
   floatAt(cr,`STRONG FIT! −${dmg}`,'#c7ef3a');if(B.combo>1)setTimeout(()=>floatAt(cr,`🔥 COMBO ×${B.combo}`,'#7fe3e4'),250);
   coach('s',`<b class="h">✅ ${c.e} ${c.n}: strong fit! ×2</b>${B.c.s[inst.id]}`);}
  else if(rel==='n'){SFX.neutral();if(counts)addScore(20);if(dmg)floatAt(cr,`−${dmg}`,'#ffffff');if(s.b)floatAt('#prep',`+${s.b} 🛡️`,'#7fe3e4');
   coach('n',counts?`<b class="h">➖ ${c.e} ${c.n}: partial fit (½ impact)</b>Useful in general, but not a targeted fix for “${B.c.n}”. <div class="sm">Hint: ${B.c.h}</div>`:`<b class="h">${c.e} ${c.n}</b>Support played: ${[s.b?`+${s.b} Prep`:'',s.d?`drew ${s.d}`:'',s.h?`+${s.h} morale`:''].filter(Boolean).join(', ')}.`);}
  else{SFX.back();addScore(-50);G.morale=Math.max(0,G.morale-4);flash('rgba(200,18,110,.45)');floatAt('#mb','BACKFIRE! −4 ❤️','#ff7fbf');
   $('#battle').animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:300});
   coach('b',`<b class="h">⚠️ ${c.e} ${c.n} BACKFIRED!</b>${B.c.b[inst.id]}`);}
  B.disc.push(inst);
  const over=B.hp<=0||G.morale<=0;
  B.busy=over;upd();
  if(B.hp<=0)setTimeout(winBattle,450);else if(G.morale<=0)setTimeout(loseBattle,450);
 },260);
}
function ask(){
 if(!B.ask||B.busy)return;B.ask=0;SFX.click();
 const h=B.hand.find(x=>B.c.s[x.id]);
 if(h){coach('s',`<b class="h">🤝 A colleague leans over…</b>“Have you tried <b>${CARDS[h.id].n}</b>? It’s exactly what this situation needs.”`);upd();const e=document.querySelector(`#hand .card[data-uid="${h.uid}"]`);if(e)e.classList.add('hint');return;}
 const inDeck=[...new Set([...B.draw,...B.disc].filter(x=>B.c.s[x.id]).map(x=>CARDS[x.id].n))];

function endTurn(){
 if(!B||B.busy)return;B.busy=true;
 const junk=B.hand.filter(h=>CARDS[h.id].junk).length;
 if(junk){G.morale=Math.max(0,G.morale-2*junk);floatAt('#mb',`🔔 −${2*junk} ❤️`,'#ff7fbf');}
 B.disc.push(...B.hand.filter(h=>!CARDS[h.id].junk));B.hand=[];
 const it=intentInfo(),taken=Math.max(0,it.p-B.prep);
 G.morale=Math.max(0,G.morale-taken);
 if(it.k==='distract'){for(let i=0;i<2;i++)B.draw.splice(rnd(B.draw.length+1),0,mk('notif'));}
 if(it.k==='drain')B.drain=1;
 SFX.hit();const cr=$('#cr');cr.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:300});
 floatAt('#mb',taken?`−${taken} ❤️`:'🛡️ BLOCKED!',taken?'#ff7fbf':'#7fe3e4');if(taken)flash('rgba(200,18,110,.25)');
 if(it.k==='distract')setTimeout(()=>toast('🔔 2 Notifications were shuffled into your draw pile!'),200);
 if(it.k==='drain')setTimeout(()=>toast('⚡ Load-shedding! You’ll have 1 less ⏱ next turn.'),200);

 const me=B;setTimeout(()=>{if(B!==me)return;if(G.morale<=0)loseBattle();else startTurn();},650);
}

function upgrade(){
 const d=G.deck.filter(x=>!x.up);
 $('#screen').innerHTML=`<div class="panel"><span class="tag" style="background:#8FAD15">⬆️ Upgrade</span><h2>Choose a card to upgrade</h2><div class="grid">${d.map(x=>cardHTML(x)).join('')}</div></div>`;
 document.querySelectorAll('.grid .card').forEach(e=>e.onclick=()=>{const x=G.deck.find(y=>y.uid===+e.dataset.uid);x.up=true;SFX.win();toast(`⬆️ ${CARDS[x.id].n} upgraded!`);retire();});
}
function retire(){
 const d=G.deck.slice().sort((a,b)=>CARDS[a.id].m-CARDS[b.id].m);
 $('#screen').innerHTML=`<div class="panel"><span class="tag">🧹 Spring clean</span><h2>Retire one card from your deck? (optional)</h2>
  <p>A focused toolkit beats a cluttered one. <i>Don’t introduce too many tools, and certainly not all at once.</i> Retiring weak or risky cards means you’ll draw your best ones more often.</p>
  <div class="row" style="margin-bottom:6px"><button class="btn g" id="keep">Keep my deck as is ▶</button></div>
  <div class="grid">${d.map(x=>cardHTML(x)).join('')}</div></div>`;
 const next=()=>{G.ch++;mapScreen();};
 document.querySelectorAll('.grid .card').forEach(e=>e.onclick=()=>{if(G.deck.length<=8){toast('Keep at least 8 cards in your deck.');return;}const i=G.deck.findIndex(y=>y.uid===+e.dataset.uid);const n=CARDS[G.deck[i].id].n;G.deck.splice(i,1);SFX.click();toast(`🧹 ${n} retired.`);next();});
 $('#keep').onclick=next;
}

function bossIntro(){
 SFX.boss();
 const mods=shuffle([1,2,3,4,5,6,7]);const list=[];
 for(const m of mods){if(list.length===3)break;const p=CRISES.filter(c=>c.m===m&&!G.faced.includes(c.id));const q=p.length?p:CRISES.filter(c=>c.m===m);list.push(q[rnd(q.length)]);}
 G.boss={list,phase:0};
 const c=openOv(`<div style="text-align:center"><div style="font-size:110px;filter:drop-shadow(0 0 24px #C8126E)">🗿</div><h1 style="color:#fff;letter-spacing:.06em">THE STATUS QUO</h1>
  <p style="color:#f3d6e6;font-size:18px"><i>“We’ve always done it this way. Chalk worked for my teachers, and it’ll work for yours.”</i></p>
  <p style="color:#dfe7ff">Three back-to-back crises from <b>${list.map(x=>'Module '+x.m).join(', ')}</b>. Morale carries over (+10 between phases). First, one last <b>Legendary booster</b> from all modules.</p>
  <div class="row" style="justify-content:center"><button class="btn g big" id="go">🎁 Open the final booster</button></div></div>`,'title dark');
 c.querySelector('#go').onclick=()=>{closeOv();booster(0,null,()=>startBattle(list[0],true));};
}
function victory(){
 closeOv();SFX.win();setTimeout(SFX.win,500);
 const tot=G.st.strong+G.st.neutral+G.st.back,j=tot?Math.round(G.st.strong/tot*100):0,secs=Math.round((performance.now()-G.start)/1000);
 const rank=j>=70?['👑','Classroom Legend','Your judgement is outstanding. You consistently matched the right strategy to the right problem.']:j>=55?['⚡','Transformation Agent','Strong, thoughtful choices across all seven modules.']:j>=40?['🔧','Digital Innovator','A solid foundation. Revisit the debriefs to sharpen your judgement even further.']:['🌱','Rising Practitioner','Every legend starts somewhere. Replay and use the coach’s debriefs to level up.'];
 let best=0;try{best=+localStorage.getItem('clBest')||0;if(G.score>best)localStorage.setItem('clBest',G.score);}catch(e){}
 $('#tChap').textContent='Term complete!';
 $('#screen').innerHTML=`<div class="panel"><div style="text-align:center"><span class="tag" style="background:#00A1A3">Digital Skills Course · Final Challenge complete</span>
  <div class="badge"><div><div class="e">${rank[0]}</div><b style="font-size:15px">${rank[1]}</b><span style="font-size:11px">Modules 1–7</span></div></div>
  <h1>${playerName?esc(playerName)+', the':'The'} Status Quo has fallen!</h1><p>${rank[2]}</p></div>
  <div class="sgrid"><div><b>${G.score}</b>final score${G.score>best&&best?'<br>🏅 NEW BEST':''}</div><div><b>${j}%</b>judgement</div><div><b>${G.st.strong}</b>strong plays</div><div><b>${G.st.back}</b>backfires</div><div><b>${G.st.kqr}/${G.st.kq}</b>knowledge checks</div><div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b>total time</div></div>
  <p style="text-align:center;font-size:15px;color:#4a5680">📸 Screenshot your badge to celebrate completing the course.</p>
  <div class="row" style="justify-content:center"><button class="btn g big" id="again">🔁 Play again</button><button class="ghost fsb" id="fs">⛶ Full screen</button></div>
  <h2 style="text-align:center;margin-top:18px">Your final deck</h2><div class="grid nopick">${G.deck.map(x=>cardHTML(x)).join('')}</div></div>`;
 fsIcon();$('#fs').onclick=toggleFS;$('#again').onclick=titleScreen;
}

window.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.code==='KeyF'){toggleFS();return;}
 if(e.code==='KeyM'){toggleMute();return;}
 if(!B||$('#ov').classList.contains('show')||!$('#battle'))return;
 if(e.code==='KeyE'){endTurn();return;}
 const n=parseInt(e.key);if(n>=1&&n<=9&&B.hand[n-1])play(B.hand[n-1].uid);
});

titleScreen();
})();
</script>
</body>
</html>
