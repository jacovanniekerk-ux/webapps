<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <!-- Import html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Error Message Styling */
        #error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f87171;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Main Workspace Styling */
        #workspace {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* The actual A4 Certificate Container */
        #certificate {
            position: relative;
            /* A4 Portrait proportions, matches the 1061x1500 background image ratio */
            width: 794px;
            height: 1123px;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Background Image - Fixed to fill container perfectly */
        #cert-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* Overlay Text Container */
        .cert-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /*
           POSITIONING THE TEXT
           Coordinates below were measured directly against the supplied
           background.jpg (the two teal horizontal rules and the
           "HOSTING UNIT:" / "DATE:" labels) so the overlays land exactly
           where they belong.
        */
        .text-overlay {
            position: absolute;
            color: #1a237e; /* Navy blue, matches the certificate's heading colour */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            white-space: nowrap;
        }

        /* Sits just above the first teal rule ("...presented to:") */
        #cert-name {
            top: 39.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sits just above the second teal rule ("for successfully completing") */
        #cert-session {
            top: 56.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: normal;
        }

        /* Immediately after the "HOSTING UNIT:" label */
        #cert-unit {
            top: 66.8%;
            left: 34%;
            font-size: 20px;
            font-weight: 600;
        }

        /* Immediately after the "DATE:" label */
        #cert-date {
            top: 72.2%;
            left: 20.5%;
            font-size: 20px;
            font-weight: 600;
        }

        /* Button Styling */
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- Error Message Container -->
    <div id="error-message">
        <h2>Invalid Link</h2>
        <p>We couldn't generate your certificate. It looks like the link you clicked is missing important information (name, unit, session, or date). Please contact the session organizer for a valid link.</p>
    </div>

    <!-- Workspace Container (hidden if there's an error) -->
    <div id="workspace">
        <div id="certificate">
            <img id="cert-background" src="background.jpg" alt="Certificate Background">

            <div class="cert-content">
                <div id="cert-name" class="text-overlay"></div>
                <div id="cert-session" class="text-overlay"></div>
                <div id="cert-unit" class="text-overlay"></div>
                <div id="cert-date" class="text-overlay"></div>
            </div>
        </div>

        <button onclick="downloadPDF()">Download Certificate as PDF</button>
    </div>

    <script>
        // 1. Read the URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        const participantName = urlParams.get('name');
        const hostingUnit = urlParams.get('unit');
        const sessionName = urlParams.get('session');
        const sessionDate = urlParams.get('date');

        // 2. Check if all required parameters are present
        if (!participantName || !hostingUnit || !sessionName || !sessionDate) {
            // Show error, hide workspace
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('workspace').style.display = 'none';
        } else {
            // Show workspace, populate data
            document.getElementById('workspace').style.display = 'flex';

            // Insert the data into the HTML
            document.getElementById('cert-name').innerText = participantName;
            document.getElementById('cert-session').innerText = sessionName;
            document.getElementById('cert-unit').innerText = hostingUnit;
            document.getElementById('cert-date').innerText = sessionDate;
        }

        // 3. Function to trigger the PDF download
        function downloadPDF() {
            const element = document.getElementById('certificate');

            // Options for html2pdf
            const opt = {
                margin:       0,
                filename:     `${participantName.replace(/ /g, '_')}_Certificate.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true }, // Scale 2 ensures high resolution
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Generate and save the PDF
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
