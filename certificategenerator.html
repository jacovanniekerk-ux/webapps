<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <!-- Import html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Century Gothic', 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f87171;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #workspace {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ============================================================
           PREVIEW (what the user actually sees)
           Genuinely responsive: width caps at 400px or 90% of viewport,
           whichever is smaller, and height follows via aspect-ratio.
           No scale()/zoom hacks, so it behaves the same on any phone
           or desktop. container-type lets the text overlays size
           themselves relative to THIS element's width (cqw units)
           instead of a fixed px value, so text scales perfectly with
           the box at any size.
           ============================================================ */
        #certificate-preview {
            position: relative;
            width: min(90vw, 400px);
            aspect-ratio: 794 / 1123;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 25px;
            container-type: inline-size;
        }

        /* ============================================================
           EXPORT CLONE (never shown, used only by html2pdf)
           Fixed at true 794x1123 A4 pixel size so the PDF capture is
           always full-resolution and never affected by however the
           preview happens to be sized on a given device.
           ============================================================ */
        #certificate-export {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 794px;
            height: 1123px;
            background-color: white;
            overflow: hidden;
            /* deliberately no box-shadow: a shadow is painted outside
               the element's own box and isn't clipped by overflow, so
               html2canvas would capture a canvas a few px taller/wider
               than one A4 page -- that's the #1 cause of the blank
               second page. Simplest fix is to just never put a shadow
               on the element that gets captured. */
        }

        .cert-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        .cert-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .text-overlay {
            position: absolute;
            color: #1a237e;
            font-family: 'Century Gothic', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            white-space: nowrap;
        }

        /* Coordinates as % (unchanged) so both the 794px export clone
           and the responsive preview line up with the background art
           at any size. */
        .cert-name  { top: 41.5%; left: 0; width: 100%; text-align: center; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .cert-session { top: 59.5%; left: 0; width: 100%; text-align: center; font-weight: bold; }
        .cert-unit  { top: 65.5%; left: 32.5%; font-weight: 600; }
        .cert-date  { top: 70.7%; left: 32.5%; font-weight: 600; }

        /* Export clone: original fixed px sizes, tuned against the
           actual 794x1123 artwork. */
        #certificate-export .cert-name  { font-size: 34px; }
        #certificate-export .cert-session { font-size: 24px; }
        #certificate-export .cert-unit  { font-size: 26px; }
        #certificate-export .cert-date  { font-size: 26px; }

        /* Preview clone: same sizes expressed as cqw (% of the preview
           container's own width, since 794px is 100cqw at export
           size) -- e.g. 34/794*100 = 4.28cqw -- so they scale exactly
           in proportion as the preview grows/shrinks. */
        #certificate-preview .cert-name  { font-size: 4.28cqw; }
        #certificate-preview .cert-session { font-size: 3.02cqw; }
        #certificate-preview .cert-unit  { font-size: 3.27cqw; }
        #certificate-preview .cert-date  { font-size: 3.27cqw; }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: default; }
    </style>
</head>
<body>

    <div id="error-message">
        <h2>Invalid Link</h2>
        <p>We couldn't generate your certificate. It looks like the link you clicked is missing important information (name, unit, session, or date). Please contact the session organizer for a valid link.</p>
    </div>

    <div id="workspace">

        <!-- Visible, responsive thumbnail -->
        <div id="certificate-preview">
            <img class="cert-bg" src="certificate.jpg" alt="Certificate Background">
            <div class="cert-content">
                <div class="text-overlay cert-name" data-field="name"></div>
                <div class="text-overlay cert-session" data-field="session"></div>
                <div class="text-overlay cert-unit" data-field="unit"></div>
                <div class="text-overlay cert-date" data-field="date"></div>
            </div>
        </div>

        <!-- Hidden, full-resolution clone used only for PDF export -->
        <div id="certificate-export">
            <img class="cert-bg" src="certificate.jpg" alt="Certificate Background">
            <div class="cert-content">
                <div class="text-overlay cert-name" data-field="name"></div>
                <div class="text-overlay cert-session" data-field="session"></div>
                <div class="text-overlay cert-unit" data-field="unit"></div>
                <div class="text-overlay cert-date" data-field="date"></div>
            </div>
        </div>

        <button id="download-btn" onclick="downloadPDF()">Download Certificate as PDF</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const participantName = urlParams.get('name');
        const hostingUnit = urlParams.get('unit');
        const sessionName = urlParams.get('session');
        const sessionDate = urlParams.get('date');

        if (!participantName || !hostingUnit || !sessionName || !sessionDate) {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('workspace').style.display = 'none';
        } else {
            document.getElementById('workspace').style.display = 'flex';

            // Populate both the preview and the hidden export clone at once
            const data = { name: participantName, session: sessionName, unit: hostingUnit, date: sessionDate };
            for (const [field, value] of Object.entries(data)) {
                document.querySelectorAll(`[data-field="${field}"]`).forEach(el => el.innerText = value);
            }
        }

        function downloadPDF() {
            const element = document.getElementById('certificate-export');
            const btn = document.getElementById('download-btn');

            btn.disabled = true;
            btn.innerText = 'Generating PDF...';

            const opt = {
                margin: 0,
                filename: `${participantName.replace(/ /g, '_')}_Certificate.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    scrollY: 0,
                    // Lock capture to the exact true A4 pixel size so
                    // nothing rounds up into a second, blank page.
                    width: 794,
                    height: 1123,
                    windowWidth: 794,
                    windowHeight: 1123
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all'] }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                btn.disabled = false;
                btn.innerText = 'Download Certificate as PDF';
            }).catch((err) => {
                btn.disabled = false;
                btn.innerText = 'Download Certificate as PDF';
                console.error('PDF generation failed:', err);
            });
        }
    </script>
</body>
</html>
