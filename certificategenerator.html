<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <!-- Import html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Century Gothic isn't a web font; Poppins is loaded as a close geometric-sans
         fallback for visitors who don't have Century Gothic installed locally -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Century Gothic', 'Poppins', sans-serif;
            background-color: #f3f4f6;
               margin: 0;
            padding: 0; 
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Error Message Styling */
        #error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f87171;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Main Workspace Styling */
        #workspace {
            display: none; /*[cite: 1] */
    width: 100%; /*[cite: 1] */
    
    /* 2. Make the workspace fill the screen and allow absolute positioning inside */
    height: 100%;
    position: relative;
        }

        /* The actual A4 Certificate Container */
        #certificate {
            position: absolute;
    top: 20px;
    width: 794px; /*[cite: 1] */
    height: 1123px; /*[cite: 1] */
    background-color: white; /*[cite: 1] */
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); /*[cite: 1] */
    overflow: hidden; /*[cite: 1] */
    
    /* 4. Magic Formula: Scale down based on whichever is smaller (available height or width) */
    /* This ensures it perfectly fits any screen, leaving room for the button */
    transform: scale(min(calc((100vh - 120px) / 1123), calc((100vw - 40px) / 794)));
    transform-origin: top center;
        }

        /* Background Image - Fixed to fill container perfectly */
        #cert-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* Overlay Text Container */
        .cert-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /*
           POSITIONING THE TEXT
           Coordinates below were measured directly against the current
           background.jpg (the two lime-green rules, and the "HOSTING UNIT:"
           / "DATE:" labels, which in this version both right-align to the
           same edge) so the overlays land exactly where they belong.
        */
        .text-overlay {
            position: absolute;
            color: #1a237e; /* Navy blue, matches the certificate's heading colour */
            font-family: 'Century Gothic', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            white-space: nowrap;
        }

        /* Sits just above the first (lime) rule ("...presented to:") */
        #cert-name {
            top: 41.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sits just above the second (lime) rule ("for attending...") */
        #cert-session {
            top: 59.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Immediately after the "HOSTING UNIT:" label. "HOSTING UNIT:" and
           "DATE:" both end at the same x position in this design, so both
           values share the same left offset. Font size increased per
           feedback (was 20px, too small). */
        #cert-unit {
            top: 65.5%;
            left: 32.5%;
            font-size: 26px;
            font-weight: 600;
        }

        /* Immediately after the "DATE:" label (which is indented so its
           right edge lines up with "HOSTING UNIT:" above it) */
        #cert-date {
            top: 70.7%;
            left: 32.5%;
            font-size: 26px;
            font-weight: 600;
        }

        /* Button Styling */
       button {
    background-color: #2563eb; /*[cite: 1] */
    color: white; /*[cite: 1] */
    border: none; /*[cite: 1] */
    padding: 15px 30px; /*[cite: 1] */
    font-size: 18px; /*[cite: 1] */
    font-weight: bold; /*[cite: 1] */
    border-radius: 8px; /*[cite: 1] */
    cursor: pointer; /*[cite: 1] */
    transition: background-color 0.2s; /*[cite: 1] */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /*[cite: 1] */
    
    /* 5. Anchor the button to the absolute bottom center of the screen */
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
}

button:hover {
    background-color: #1d4ed8; /*[cite: 1] */
}
    </style>
</head>
<body>

    <!-- Error Message Container -->
    <div id="error-message">
        <h2>Invalid Link</h2>
        <p>We couldn't generate your certificate. It looks like the link you clicked is missing important information (name, unit, session, or date). Please contact the session organizer for a valid link.</p>
    </div>

    <!-- Workspace Container (hidden if there's an error) -->
    <div id="workspace">
        <div id="certificate">
            <img id="cert-background" src="certificate.jpg" alt="Certificate Background">

            <div class="cert-content">
                <div id="cert-name" class="text-overlay"></div>
                <div id="cert-session" class="text-overlay"></div>
                <div id="cert-unit" class="text-overlay"></div>
                <div id="cert-date" class="text-overlay"></div>
            </div>
        </div>

        <button onclick="downloadPDF()">Download Certificate as PDF</button>
    </div>

    <script>
        // 1. Read the URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        const participantName = urlParams.get('name');
        const hostingUnit = urlParams.get('unit');
        const sessionName = urlParams.get('session');
        const sessionDate = urlParams.get('date');

        // 2. Check if all required parameters are present
        if (!participantName || !hostingUnit || !sessionName || !sessionDate) {
            // Show error, hide workspace
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('workspace').style.display = 'none';
        } else {
            // Show workspace, populate data
            document.getElementById('workspace').style.display = 'flex';

            // Insert the data into the HTML
            document.getElementById('cert-name').innerText = participantName;
            document.getElementById('cert-session').innerText = sessionName;
            document.getElementById('cert-unit').innerText = hostingUnit;
            document.getElementById('cert-date').innerText = sessionDate;
        }

        // 3. Function to trigger the PDF download
function downloadPDF() {
    const element = document.getElementById('certificate'); //

    // Options for html2pdf
    const opt = {
        margin:       0, //[cite: 1]
        filename:     `${participantName.replace(/ /g, '_')}_Certificate.pdf`, //[cite: 1]
        image:        { type: 'jpeg', quality: 0.98 }, //[cite: 1]
        // ADD scrollY: 0 TO THE LINE BELOW
        html2canvas:  { scale: 2, useCORS: true, scrollY: 0 }, 
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' } //[cite: 1]
    };

    // Generate and save the PDF
    html2pdf().set(opt).from(element).save(); //[cite: 1]
}
    </script>
</body>
</html>
