<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <!-- Import html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Century Gothic isn't a web font; Poppins is loaded as a close geometric-sans
         fallback for visitors who don't have Century Gothic installed locally -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* no scrolling, ever */
            background-color: #f3f4f6;
            font-family: 'Century Gothic', 'Poppins', sans-serif;
        }

        /* Error Message Styling */
        #error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f87171;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /*
           Main Workspace Styling
           --------------------------------------------------------------
           IMPORTANT: this stays position:absolute / not part of a flex
           flow. The certificate is scaled down with a CSS transform,
           and transform does NOT change the space an element takes up
           in normal document flow — a flex/grid container would still
           reserve the certificate's full untransformed 1123px height,
           which is what pushed the button out of view before. Pinning
           both the certificate and the button independently to the
           viewport sidesteps that problem entirely.
        */
        #workspace {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* The actual A4 Certificate Container */
        #certificate {
            position: absolute;
            top: 20px;
            left: 50%;
            width: 794px;
            height: 1123px;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;

            /* Scale down to fit the available space (viewport minus room
               for the button), then re-center horizontally with
               translateX since left:50% alone would only center the
               untransformed box. transform-origin stays top center so
               the scaling shrinks toward the top-middle, matching where
               we anchor it. */
            transform: translateX(-50%) scale(min(calc((100vh - 120px) / 1123), calc((100vw - 40px) / 794)));
            transform-origin: top center;
        }

        /* Background Image - Fixed to fill container perfectly */
        #cert-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        /* Overlay Text Container */
        .cert-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /*
           POSITIONING THE TEXT
           Coordinates below were measured directly against the current
           background.jpg (the two lime-green rules, and the "HOSTING UNIT:"
           / "DATE:" labels, which in this version both right-align to the
           same edge) so the overlays land exactly where they belong.
        */
        .text-overlay {
            position: absolute;
            color: #1a237e; /* Navy blue, matches the certificate's heading colour */
            font-family: 'Century Gothic', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            white-space: nowrap;
        }

        /* Sits just above the first (lime) rule ("...presented to:") */
        #cert-name {
            top: 41.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sits just above the second (lime) rule ("for attending...") */
        #cert-session {
            top: 59.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Immediately after the "HOSTING UNIT:" label. "HOSTING UNIT:" and
           "DATE:" both end at the same x position in this design, so both
           values share the same left offset. */
        #cert-unit {
            top: 65.5%;
            left: 32.5%;
            font-size: 26px;
            font-weight: 600;
        }

        /* Immediately after the "DATE:" label (which is indented so its
           right edge lines up with "HOSTING UNIT:" above it) */
        #cert-date {
            top: 70.7%;
            left: 32.5%;
            font-size: 26px;
            font-weight: 600;
        }

        /*
           Button Styling
           --------------------------------------------------------------
           position:fixed anchors this to the viewport, independent of
           #workspace's layout mode. It will always sit at the same spot
           on screen no matter how the certificate above it is scaled.
        */
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Error Message Container -->
    <div id="error-message">
        <h2>Invalid Link</h2>
        <p>We couldn't generate your certificate. It looks like the link you clicked is missing important information (name, unit, session, or date). Please contact the session organizer for a valid link.</p>
    </div>

    <!-- Workspace Container (hidden if there's an error) -->
    <div id="workspace">
        <div id="certificate">
            <img id="cert-background" src="certificate.jpg" alt="Certificate Background">

            <div class="cert-content">
                <div id="cert-name" class="text-overlay"></div>
                <div id="cert-session" class="text-overlay"></div>
                <div id="cert-unit" class="text-overlay"></div>
                <div id="cert-date" class="text-overlay"></div>
            </div>
        </div>

        <button id="download-btn" onclick="downloadPDF()">Download Certificate as PDF</button>
    </div>

    <script>
        // 1. Read the URL parameters
        const urlParams = new URLSearchParams(window.location.search);

        const participantName = urlParams.get('name');
        const hostingUnit = urlParams.get('unit');
        const sessionName = urlParams.get('session');
        const sessionDate = urlParams.get('date');

        // 2. Check if all required parameters are present
        if (!participantName || !hostingUnit || !sessionName || !sessionDate) {
            // Show error, hide workspace
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('workspace').style.display = 'none';
        } else {
            // Show workspace, populate data
            document.getElementById('workspace').style.display = 'block';

            // Insert the data into the HTML
            document.getElementById('cert-name').innerText = participantName;
            document.getElementById('cert-session').innerText = sessionName;
            document.getElementById('cert-unit').innerText = hostingUnit;
            document.getElementById('cert-date').innerText = sessionDate;
        }

        // 3. Function to trigger the PDF download
        function downloadPDF() {
            const element = document.getElementById('certificate');
            const btn = document.getElementById('download-btn');

            // --- Fix for blurry PDFs AND the blank second page ---
            // #certificate is normally drawn with `transform: scale(...)`
            // so it fits the screen. html2canvas/html2pdf can trip over
            // that transform: depending on the browser/library version it
            // may capture the *visually shrunk* box, or it may miscompute
            // the element's height by a fraction of a pixel once the
            // transform and box-shadow are factored in. That rounding
            // error is enough to spill one extra sliver of canvas onto a
            // second, otherwise-blank A4 page.
            //
            // The fix: temporarily remove the transform so html2canvas
            // captures the certificate at its true, untransformed
            // 794x1123 size, then restore the transform afterwards. This
            // also produces a sharper capture than screenshotting the
            // scaled-down version would.
            const originalTransform = element.style.transform;
            element.style.transform = 'none';
            btn.disabled = true;
            btn.innerText = 'Generating PDF...';

            const opt = {
                margin: 0,
                filename: `${participantName.replace(/ /g, '_')}_Certificate.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    scrollY: 0,
                    // Lock the capture to the certificate's exact
                    // unscaled pixel size so nothing rounds up into an
                    // extra page.
                    width: 794,
                    height: 1123,
                    windowWidth: 794,
                    windowHeight: 1123
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                // Belt-and-braces: explicitly tell html2pdf's paginator
                // not to try to split content across pages.
                pagebreak: { mode: ['avoid-all'] }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                // Restore the on-screen scaled view once export is done
                element.style.transform = originalTransform;
                btn.disabled = false;
                btn.innerText = 'Download Certificate as PDF';
            }).catch((err) => {
                element.style.transform = originalTransform;
                btn.disabled = false;
                btn.innerText = 'Download Certificate as PDF';
                console.error('PDF generation failed:', err);
            });
        }
    </script>
</body>
</html>
